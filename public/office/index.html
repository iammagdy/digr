];
const STACKED_BAND = 36;
const STACKED_GAP = 10;
let STACKED_ON = false;
let stackedLayout = null;
let stackedHeightCache = -1;

function stackedActive() {
  return window.matchMedia('(max-width: 640px) and (orientation: portrait)').matches;
}

function computeStackedLayout() {
  const w = canvas.clientWidth || window.innerWidth || 390;
  let top = 0;
  const strips = STACKED_STRIPS.map(r => {
    const s = w / r.w;
    const h = STACKED_BAND + r.h * s;
    const strip = Object.assign({}, r, { top: top, hCss: h, s: s, roomTop: top + STACKED_BAND });
    top += h + STACKED_GAP;
    return strip;
  });
  return { totalH: top - STACKED_GAP, strips: strips };
}

function syncCanvasSizing() {
  if (stackedActive()) {
    STACKED_ON = true;
    const layout = computeStackedLayout();
    stackedLayout = layout;
    if (stackedHeightCache !== layout.totalH) {
      stackedHeightCache = layout.totalH;
      canvas.style.height = layout.totalH + 'px';
    }
  } else {
    if (STACKED_ON) { canvas.style.height = ''; stackedHeightCache = -1; stackedLayout = null; }
    STACKED_ON = false;
  }

  const rect = canvas.getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const targetW = Math.max(320, Math.round((rect.width || BASE_W) * dpr));
  const targetH = Math.max(216, Math.round((rect.height || BASE_H) * dpr));
  if (canvas.width !== targetW || canvas.height !== targetH) {
    canvas.width = targetW;
    canvas.height = targetH;
  }
  syncSideRails();
}

// V4.4: side rails only when the centered office leaves real empty space on
// both sides (world 960x600, uniform scale). Gap = (stageW - worldW) / 2.
function syncSideRails() {
  const stage = document.getElementById('stage-wrapper');
  if (!stage) return;
  const rect = canvas.getBoundingClientRect();
  const suCss = Math.min(rect.width / BASE_W, rect.height / BASE_H);
  const gap = (rect.width - BASE_W * suCss) / 2;
  const show = !STACKED_ON && gap >= 140; // manager button needs ~130px
  stage.classList.toggle('show-side-rails', show);
}

window.addEventListener('resize', syncCanvasSizing);
window.addEventListener('orientationchange', () => setTimeout(syncCanvasSizing, 120));

function drawStripTitle(st, topPx, dpr) {
  const pad = 12 * dpr;
  const bandH = STACKED_BAND * dpr;
  const fontPx = 14.5 * dpr;
  const pillH = 24 * dpr;
  const pillY = topPx + (bandH - pillH) / 2;
  ctx.save();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.font = '700 ' + fontPx + 'px "IBM Plex Sans Arabic", Tahoma, sans-serif';
  ctx.textAlign = 'right';
  ctx.textBaseline = 'middle';
  const tw = ctx.measureText(st.label).width;
  const pillW = tw + 22 * dpr;
  const x0 = canvas.width - pad - pillW;
  const r = pillH / 2;
  ctx.beginPath();
  ctx.moveTo(x0 + r, pillY);
  ctx.arcTo(x0 + pillW, pillY, x0 + pillW, pillY + pillH, r);
  ctx.arcTo(x0 + pillW, pillY + pillH, x0, pillY + pillH, r);
  ctx.arcTo(x0, pillY + pillH, x0, pillY, r);
  ctx.arcTo(x0, pillY, x0 + pillW, pillY, r);
  ctx.closePath();
  ctx.fillStyle = 'rgba(7, 11, 19, 0.88)';
  ctx.fill();
  ctx.strokeStyle = st.border;
  ctx.lineWidth = Math.max(1, dpr);
  ctx.stroke();
  ctx.fillStyle = st.color;
  ctx.fillText(st.label, x0 + pillW - 11 * dpr, pillY + pillH / 2);
  ctx.restore();
}

function renderStacked(time) {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const layout = stackedLayout || computeStackedLayout();
  ctx.save();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#080e1a';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.imageSmoothingEnabled = false;

  for (const st of layout.strips) {
    const s = st.s * dpr;
    const topPx = st.top * dpr;
    const roomTopPx = st.roomTop * dpr;
    const roomHPx = (st.hCss - STACKED_BAND) * dpr;

    ctx.fillStyle = '#0e1624';
    ctx.fillRect(0, topPx, canvas.width, STACKED_BAND * dpr);

    ctx.save();
    ctx.beginPath();
    ctx.rect(0, roomTopPx, canvas.width, roomHPx);
    ctx.clip();
    ctx.setTransform(s, 0, 0, s, -st.x * s, roomTopPx - st.y * s);
    drawWorld(time, false);
    ctx.restore();

    drawStripTitle(st, topPx, dpr);
  }
  ctx.restore();
}

// ---------- World Update & Render ----------
function updateWorld(dt, time) {
  // 1. Bots returning home after a meeting or ended interaction
  for (const key of BOT_KEYS) {
    const bot = BOTS[key];
    if (bot.returningHome && !teamMeetingActive) {
      if (followRoute(bot, 78, dt)) {
        bot.returningHome = false;
        bot.status = bot.feedStatus;
      }
      continue;
    }

    // Wandering designer (Hazalqom when idle and free)
    if (!teamMeetingActive && !bot.onTrip && bot.wander && bot.waypoints && bot.waypoints.length) {
      if (bot.currentWp === undefined) bot.currentWp = 0;
      if (!bot.waitTimer) bot.waitTimer = 0;
      const wp = bot.waypoints[bot.currentWp];
      const dx = wp.x - bot.x, dy = wp.y - bot.y;
      const dist = Math.hypot(dx, dy);
      if (dist < 2.5) {
        bot.isMoving = false;
        bot.waitTimer += dt * 1000;
        if (bot.waitTimer >= (wp.wait || 3000)) {
          bot.waitTimer = 0;
          bot.currentWp = (bot.currentWp + 1) % bot.waypoints.length;
        }
      } else {
        bot.isMoving = true;
        const speed = 28;
        bot.x += (dx / dist) * speed * dt;
        bot.y += (dy / dist) * speed * dt;
      }
    }
  }

  updateCoffeeTrip(dt, time);
  updateInteractions(dt, time);
  updateTeamMeeting(dt, time);
  updateOfficeEvents(time); // V4: single event queue (comedy, inspections, alarms)
  updateBotSleep();
  for (const key of BOT_KEYS) updateBotCode(BOTS[key], dt);

  spawnParticles();
  updateParticles();
}

// V4: night glow from screens / TV / meeting screen (NIGHT_PHASE only)
function drawNightGlow() {
  if (PHASE.key !== 'night') return;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  const spots = [[74, 380, 60], [450, 375, 55]];
  for (const k of BOT_KEYS) {
    const b = BOTS[k];
    if (b.deskType === 'dev' || b.deskType === 'design') spots.push([b.deskX + b.deskW / 2, b.deskY - 3, 30]);
  }
  for (const s of spots) {
    const g = ctx.createRadialGradient(s[0], s[1], 2, s[0], s[1], s[2]);
    g.addColorStop(0, 'rgba(56, 189, 248, 0.13)');
    g.addColorStop(1, 'rgba(56, 189, 248, 0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(s[0], s[1], s[2], 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}

function drawWorld(time, withVignette) {
  if (bgCachePhaseKey !== PHASE.key) rebuildStaticBgCache();

  ctx.imageSmoothingEnabled = false;
  // 1. Blit cached static floors + walls + windows (huge FPS win!)
  ctx.drawImage(bgCacheCanvas, 0, 0);

  // 2. Dynamic Wall Boards & Real Clock
  drawDynamicWallBoards();

  // 3. Furniture & Live Monitors
  drawOfficeFurniture(time);
  drawNightGlow(); // V4

  // 4. Particles behind / around furniture
  drawParticles();

  // 5. Bots sorted by Y — V4: split around the meeting table (y = 476) so the
  // back row sits BEHIND the table rim and the front row sits IN FRONT of it.
  const sortedBots = BOT_KEYS.map(k => BOTS[k]).sort((a, b) => a.y - b.y);
  for (const bot of sortedBots) if (bot.y < 476) drawBotEntity(bot, time);
  drawMeetingTableFront(time);
  for (const bot of sortedBots) if (bot.y >= 476) drawBotEntity(bot, time);

  // 6. Two-Pass Bubbles: Resting compact pills first, then active/hovered/speaking full bubbles ON TOP
  const priorityBots = [];
  for (const bot of sortedBots) {
    const isPriority = (hoveredBotId === bot.id) || (selectedCardBotId === bot.id)
      || (bot.bubbleUntil && time < bot.bubbleUntil)
      || (bot.chatUntil && time < bot.chatUntil);
    if (isPriority) priorityBots.push(bot);
    else drawBotBubble(bot, time, false);
  }
  for (const bot of priorityBots) drawBotBubble(bot, time, true);

  // 7. Canvas-anchored Room Labels
  drawCanvasRoomLabels();

  // 8. Atmospheric Time-of-Day Tint & Subtle Vignette
  if (PHASE.tint) {
    ctx.fillStyle = PHASE.tint;
    ctx.fillRect(-120, -120, BASE_W + 240, BASE_H + 240);
  }
  if (withVignette) {
    const vg = ctx.createRadialGradient(BASE_W / 2, BASE_H / 2, 290, BASE_W / 2, BASE_H / 2, 680);
    vg.addColorStop(0, 'rgba(0, 0, 0, 0)');
    vg.addColorStop(1, 'rgba(0, 0, 0, 0.30)');
    ctx.fillStyle = vg;
    ctx.fillRect(-120, -120, BASE_W + 240, BASE_H + 240);
  }
}

let lastFrameTime = performance.now();

function gameLoop(time) {
  const dt = Math.min((time - lastFrameTime) / 1000, 0.1);
  lastFrameTime = time;

  PHASE = resolvePhase();

  if (!STACKED_ON) {
    updateCamera(dt);
    par.x += (par.tx - par.x) * (1 - Math.exp(-dt * 2.4));
    par.y += (par.ty - par.y) * (1 - Math.exp(-dt * 2.4));
    effCamX = cam.x + par.x / cam.zoom;
    effCamY = cam.y + par.y / cam.zoom;
  } else {
    par.tx = 0; par.ty = 0; par.x = 0; par.y = 0;
    effCamX = cam.x; effCamY = cam.y;
  }

  updateWorld(dt, time);

  if (STACKED_ON) {
    renderStacked(time);
  } else {
    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = '#080e1a';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    const su = Math.min(canvas.width / BASE_W, canvas.height / BASE_H);
    ctx.setTransform(
      su * cam.zoom, 0, 0, su * cam.zoom,
      canvas.width / 2 - effCamX * su * cam.zoom,
      canvas.height / 2 - effCamY * su * cam.zoom
    );
    drawWorld(time, true);
    ctx.restore();
  }

  requestAnimationFrame(gameLoop);
}

// ---------- Pointer Hit Testing & Screen Projection ----------
const stageEl = document.getElementById('stage-wrapper');

function clientToWorld(clientX, clientY) {
  const rect = canvas.getBoundingClientRect();
  if (STACKED_ON) {
    const layout = stackedLayout || computeStackedLayout();
    const cx = clientX - rect.left;
    const cy = clientY - rect.top;
    for (const st of layout.strips) {
      if (cy >= st.roomTop && cy <= st.top + st.hCss) {
        return { x: st.x + cx / st.s, y: st.y + (cy - st.roomTop) / st.s };
      }
    }
    return null;
  }
  const suCss = Math.min(rect.width / BASE_W, rect.height / BASE_H);
  return {
    x: effCamX + ((clientX - rect.left) - rect.width / 2) / (suCss * cam.zoom),
    y: effCamY + ((clientY - rect.top) - rect.height / 2) / (suCss * cam.zoom)
  };
}

function findBotAtPointer(clientX, clientY) {
  const pt = clientToWorld(clientX, clientY);
  if (!pt) return null;
  let closest = null, bestD = 30;
  for (const key of BOT_KEYS) {
    const bot = BOTS[key];
    const d = Math.hypot(pt.x - bot.x, pt.y - (bot.y - 6));
    if (d < bestD) { bestD = d; closest = bot; }
  }
  return closest;
}

function getBotScreenPos(bot) {
  const rect = canvas.getBoundingClientRect();
  if (STACKED_ON) {
    const layout = stackedLayout || computeStackedLayout();
    for (const st of layout.strips) {
      if (bot.x >= st.x && bot.x <= st.x + st.w && bot.y >= st.y && bot.y <= st.y + st.h) {
        return {
          x: rect.left + (bot.x - st.x) * st.s,
          y: rect.top + st.roomTop + (bot.y - 6 - st.y) * st.s
        };
      }
    }
  }
  const suCss = Math.min(rect.width / BASE_W, rect.height / BASE_H);
  return {
    x: rect.left + rect.width / 2 + (bot.x - effCamX) * (suCss * cam.zoom),
    y: rect.top + rect.height / 2 + (bot.y - 6 - effCamY) * (suCss * cam.zoom)
  };
}

  const botPos = getBotScreenPos(bot);

  const cardH = card.offsetHeight || 220;

  let left = botPos.x - stageRect.left + 20;
  let top = botPos.y - stageRect.top - 24;

  const maxLeft = (stageEl.clientWidth || window.innerWidth) - cardW - 12;
  const maxTop = (STACKED_ON ? stageEl.scrollHeight : (stageEl.clientHeight || window.innerHeight)) - cardH - 12;

  if (left > maxLeft) left = Math.max(12, botPos.x - stageRect.left - cardW - 20);
  if (left < 12) left = 12;
  if (top > maxTop) top = Math.max(54, maxTop);
  if (top < 54) top = 54;

  card.style.left = left + 'px';
  card.style.top = top + 'px';
}

// Canvas Interactions
stageEl.addEventListener('mousemove', (e) => {
  if (STACKED_ON) { par.tx = 0; par.ty = 0; hoveredBotId = null; canvas.style.cursor = 'default'; return; }
  const rect = canvas.getBoundingClientRect();
  if (REDUCED_MOTION || cam.tzoom > 1.05) { par.tx = 0; par.ty = 0; }
  else {
    par.tx = (0.5 - (e.clientX - rect.left) / rect.width) * 14;
    par.ty = (0.5 - (e.clientY - rect.top) / rect.height) * 8;
  }
  const found = findBotAtPointer(e.clientX, e.clientY);
  hoveredBotId = found ? found.id : null;
  canvas.style.cursor = found ? 'pointer' : 'default';
});

stageEl.addEventListener('mouseleave', () => {
  par.tx = 0; par.ty = 0; hoveredBotId = null; canvas.style.cursor = 'default';
});

stageEl.addEventListener('touchstart', (e) => {
  if (!e.touches || !e.touches[0]) return;
  const t = e.touches[0];
  const card = document.getElementById('agent-card-popup');
  if (card && card.contains(e.target)) return;
  if (e.target.closest && (e.target.closest('.hud-bar, .side-rail') || e.target.closest('.log-drawer'))) return;
  const found = findBotAtPointer(t.clientX, t.clientY);
  if (found && found.isSleeping) {
    e.preventDefault();
    wakeUpBot(found);
  }
}, { passive: false });

stageEl.addEventListener('click', (e) => {
  if (performance.now() < suppressClickUntil) return; // V4: ignore the click after a drag-pan
  const card = document.getElementById('agent-card-popup');
  if (card && card.contains(e.target)) return;
  if (e.target.closest && (e.target.closest('.hud-bar, .side-rail') || e.target.closest('.log-drawer'))) return;

  const found = findBotAtPointer(e.clientX, e.clientY);
  if (found) {
    if (found.isSleeping) { wakeUpBot(found); return; }
    openAgentCard(found.id);
  } else {
    closeAgentCard();
  }
});

// V4: scroll-wheel zoom + drag-to-pan (desktop only — never in STACKED_ON,
// so mobile page scroll stays native). A drag suppresses the click that follows it.
let dragPan = null;
let suppressClickUntil = 0;
stageEl.addEventListener('wheel', (e) => {
  if (STACKED_ON) return;
  if (e.target.closest && (e.target.closest('.hud-bar, .side-rail') || e.target.closest('.log-drawer') || e.target.closest('.agent-popup-card'))) return;
  e.preventDefault();
  const factor = e.deltaY < 0 ? 1.15 : 1 / 1.15;
  setCamTarget(cam.tx, cam.ty, cam.tzoom * factor, null);
}, { passive: false });
stageEl.addEventListener('pointerdown', (e) => {
  if (STACKED_ON || e.pointerType === 'touch') return;
  if (e.target.closest && (e.target.closest('.hud-bar, .side-rail') || e.target.closest('.log-drawer') || e.target.closest('.agent-popup-card'))) return;
  dragPan = { x: e.clientX, y: e.clientY, tx: cam.tx, ty: cam.ty, moved: false };
});
window.addEventListener('pointermove', (e) => {
  if (!dragPan) return;
  const dx = e.clientX - dragPan.x, dy = e.clientY - dragPan.y;
  if (Math.abs(dx) + Math.abs(dy) > 6) dragPan.moved = true;
  if (!dragPan.moved) return;
  const rect = canvas.getBoundingClientRect();
  const sx = BASE_W / rect.width, sy = BASE_H / rect.height;
  setCamTarget(dragPan.tx - dx * sx / cam.tzoom, dragPan.ty - dy * sy / cam.tzoom, cam.tzoom, null);
});
window.addEventListener('pointerup', () => {
  if (dragPan && dragPan.moved) suppressClickUntil = performance.now() + 150;
  dragPan = null;
});

stageEl.addEventListener('dblclick', (e) => {
  if (STACKED_ON) return;
  if (e.target.closest && (e.target.closest('.hud-bar, .side-rail') || e.target.closest('.agent-popup-card') || e.target.closest('.log-drawer'))) return;
  const pt = clientToWorld(e.clientX, e.clientY);
  if (!pt) return;
  const targetRoom = roomAt(pt.x, pt.y);
  if (camRoom === targetRoom.name && cam.tzoom > 1.1) focusRoom('full');
  else focusRoom(targetRoom.name);
});

// ---------- Live Feed Integration ----------
let lastGoodFetchMs = null;
let lastFeedPayload = null;
let feedReachable = false;
let feedInitialized = false;

function formatMinutesAgo(ms) {
  return Math.max(0, Math.floor((Date.now() - ms) / 60000));
}

function updateHudKPIs() {
  const dot = document.getElementById('feed-dot');
  const meta = document.getElementById('feed-meta');
  if (dot && meta) {
    dot.classList.remove('live', 'offline');
    if (feedReachable && lastGoodFetchMs) {
      dot.classList.add('live');
      const mins = formatMinutesAgo(lastGoodFetchMs);
      meta.textContent = mins === 0 ? 'متصل • الآن' : ('متصل • منذ ' + mins + ' د');
    } else if (lastGoodFetchMs) {
      dot.classList.add('offline');
      meta.textContent = 'متوقف • آخر تحديث ' + formatMinutesAgo(lastGoodFetchMs) + ' د';
    } else {
      dot.classList.add('offline');
      meta.textContent = 'غير متصل بالبث';
    }
  }

  let working = 0, stuck = 0, idle = 0;
  for (const k of BOT_KEYS) {
    const st = BOTS[k].feedStatus;
    if (st === 'stuck') stuck++;
    else if (st === 'working' || st === 'waiting') working++;
    else idle++;
  }
  document.querySelectorAll('.kpi-pr').forEach(el => el.textContent = '🔀 PR مفتوح: ' + (todayStats.openPrs || 0));
  document.querySelectorAll('.kpi-work').forEach(el => el.textContent = '🟢 شغال ' + working);
  document.querySelectorAll('.kpi-stuck').forEach(el => el.textContent = '🔴 متأخر ' + stuck);
  document.querySelectorAll('.kpi-idle').forEach(el => el.textContent = '☕ متاح ' + idle);
}

function computeTodayStats(payload) {
  const now = new Date();
  const dayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
  let done = 0;
  const events = [];
  if (payload && payload.bots) {
    for (const k of BOT_KEYS) {
      const e = payload.bots[k];
      if (!e) continue;
      const t = e.updated_at ? Date.parse(e.updated_at) : NaN;
      if (!Number.isFinite(t) || t < dayStart) continue;
      events.push({ t: t, status: computeEffectiveStatus(e, Date.now()) });
      if (Array.isArray(e.recent)) done += e.recent.length;
    }
  }
  events.sort((a, b) => a.t - b.t);

  let mergedList = null;
  if (payload) {
    const candidates = [payload.merged_prs, payload.mergedprs, payload.closed_prs, payload.prs_merged, payload.merged];
    for (const c of candidates) {
      if (Array.isArray(c)) { mergedList = c; break; }
    }
    if (!mergedList && Array.isArray(payload.prs)) {
      const mergedFromPrs = payload.prs.filter(pr => pr && (pr.merged === true || String(pr.state || '').toLowerCase() === 'merged'));
      if (mergedFromPrs.length > 0 || payload.prs.some(pr => pr && ('merged' in pr || 'merged_at' in pr))) mergedList = mergedFromPrs;
    }
    if (!mergedList && Array.isArray(payload.open_prs)) {
      const flagged = payload.open_prs.filter(pr => pr && (pr.merged === true || pr.merged_at));
      if (flagged.length > 0) mergedList = flagged;
    }
  }
  let mergedPrs = null;
  if (mergedList) {
    mergedPrs = 0;
    for (const pr of mergedList) {
      if (!pr || typeof pr !== 'object') { mergedPrs++; continue; }
      const dateStr = pr.merged_at || pr.mergedAt || pr.closed_at || pr.closedAt || pr.updated_at || pr.date || null;
      if (!dateStr) { mergedPrs++; continue; }
      const t = Date.parse(dateStr);
      if (!Number.isFinite(t) || t >= dayStart) mergedPrs++;
    }
  }

  todayStats = {
    loaded: true,
    done: done,
    openPrs: payload && Array.isArray(payload.open_prs) ? payload.open_prs.length : 0,
    mergedPrs: mergedPrs,
    hasMergedData: mergedList !== null,
    events: events
  };
}

function computeEffectiveStatus(entry, nowMs) {
  const updatedMs = entry && entry.updated_at ? Date.parse(entry.updated_at) : NaN;
  const openOrder = Boolean(entry && entry.open_order);
  const rawState = String((entry && entry.state) || 'idle').toLowerCase();
  if (rawState === 'stuck') return 'stuck';
  if (rawState === 'waiting') return 'waiting';
  if (rawState === 'meeting') return 'meeting';
  const isStale = openOrder && rawState === 'working' && (!Number.isFinite(updatedMs) || (nowMs - updatedMs) > STALE_AFTER_MS);
  if (isStale) return 'stuck';
  if (rawState === 'working') return 'working';
  return 'idle';
}

function applyLiveFeed(payload) {
  if (!payload || typeof payload !== 'object' || !payload.bots) return;
  const nowMs = Date.now();
  for (const key of BOT_KEYS) {
    const bot = BOTS[key];
    const incoming = payload.bots[key];
    if (!incoming) continue;
    const prevProgress = bot.progress;
    const prevRecent = bot.recent || [];
    const status = computeEffectiveStatus(incoming, nowMs);
    const pct = Math.max(0, Math.min(100, Math.round(Number(incoming.percent) || 0)));
    const taskId = incoming.task_id ? String(incoming.task_id) : '';
    const taskTitle = incoming.task_title ? String(incoming.task_title) : '';
    const step = incoming.step ? String(incoming.step) : '';
    const next = incoming.next ? String(incoming.next) : '';

    const prevFeedStatus = bot.feedStatus;
    bot.feedStatus = status;
    // IMPORTANT FIX: Don't hijack an active team meeting!
    if (!teamMeetingActive) bot.status = status;
    // V4: light-bulb moment — a bot that just got unstuck
    if (prevFeedStatus === 'stuck' && status === 'working') bot.ideaUntil = performance.now() + 6000;

    bot.progress = status === 'idle' ? 0 : pct;
    bot.taskId = taskId;
    bot.taskTitle = taskTitle;
    bot.task_title = taskTitle;
    bot.activity_type = incoming.activity_type ? String(incoming.activity_type) : '';
    bot.step = step;
    bot.next = next;
    bot.updatedAt = incoming.updated_at || null;
    bot.openOrder = Boolean(incoming.open_order);
    bot.recent = Array.isArray(incoming.recent) ? incoming.recent.slice(0, 3).map(String) : [];

    if (feedInitialized) {
      const newFirst = bot.recent[0];
      if (newFirst && prevRecent.indexOf(newFirst) === -1) {
        celebrateBot(bot, '🎉 خلصت: ' + newFirst, true);
        addOfficeLog('✅ ' + bot.name + ' أنجز: ' + newFirst, 'done');
        // V4: Marbouha walks over with the magnifier — for real, when a task really closes
        if (key !== 'marbouha') queueOfficeEvent({ kind: 'marbouha', botId: key, task: newFirst });
      } else if (status === 'working' && prevProgress < 100 && bot.progress >= 100) {
        celebrateBot(bot, pickBanter('finished'), true);
        addOfficeLog('🚀 ' + bot.name + ' وصل 100% في مهمته', 'done');
      }
    }

    if (status === 'stuck') {
      const labelTitle = taskTitle || taskId || 'مهمة مفتوحة';
      bot.shortTask = labelTitle.slice(0, 20) + ' 🔴 متأخر';
      bot.statusLabel = '🔴 متأخر (' + bot.progress + '%)';
      bot.task = taskTitle || taskId || 'مهمة مفتوحة بدون تحديث لأكثر من ٤٥ دقيقة';
      bot.location = 'تحديث متأخر > ٤٥ دقيقة';
    } else if (status === 'waiting') {
      const labelTitle = taskTitle || taskId || 'في الانتظار';
      bot.shortTask = labelTitle.slice(0, 20) + ' ⏳ مستني';
      bot.statusLabel = '⏳ في الانتظار (' + bot.progress + '%)';
      bot.task = taskTitle || taskId || 'في انتظار الفحص أو المراجعة';
      bot.location = bot.updatedAt ? 'آخر تحديث ' + formatMinutesAgo(Date.parse(bot.updatedAt)) + ' د' : 'في الانتظار';
    } else if (status === 'meeting') {
      bot.shortTask = '👥 في اجتماع';
      bot.statusLabel = '👥 في اجتماع';
      bot.task = 'اجتماع تنسيقي للفريق';
      bot.location = 'قاعة الاجتماعات';
    } else if (status === 'working') {
      const labelTitle = taskTitle || taskId || 'شغل جاري';
      bot.shortTask = labelTitle.slice(0, 22) + ' ' + bot.progress + '%';
      bot.statusLabel = '🟢 شغال ' + bot.progress + '%';
      bot.task = taskTitle || taskId || 'مهمة قيد التنفيذ';
      bot.location = bot.updatedAt ? 'آخر تحديث ' + formatMinutesAgo(Date.parse(bot.updatedAt)) + ' د' : 'في المكتب';
    } else {
      bot.shortTask = '☕ متاح';
      bot.statusLabel = '☕ استراحة / متاح';
      bot.task = 'لا توجد مهمة مفتوحة حالياً';
      bot.location = bot.updatedAt ? 'آخر نشاط منذ ' + formatMinutesAgo(Date.parse(bot.updatedAt)) + ' د' : 'متاح';
    }

    if (bot.baseWander && !teamMeetingActive && !bot.onTrip) {
      bot.wander = (status === 'idle');
      if (!bot.wander && Math.hypot(bot.x - bot.homeX, bot.y - bot.homeY) > 6) {
        bot.returningHome = true;
        setBotRoute(bot, bot.homeX, bot.homeY);
      }
    }
  }
  computeTodayStats(payload);
  updateHudKPIs();
  if (selectedCardBotId && BOTS[selectedCardBotId]) renderAgentCard(BOTS[selectedCardBotId]);
  if (!feedInitialized) addOfficeLog('📡 تم الاتصال بالبث المباشر لمكتب ديجر', 'info');
  feedInitialized = true;
}

async function fetchLiveFeed(manual) {
  if (demoActive && !manual) return; // V4: demo mode freezes the real feed for 60s
  try {
    const res = await fetch(FEED_URL + '?t=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    if (!data || typeof data !== 'object' || !data.bots) throw new Error('Invalid feed');
    lastFeedPayload = data;
    lastGoodFetchMs = Date.now();
    feedReachable = true;
    applyLiveFeed(data);
    if (manual) addOfficeLog('↻ تم تحديث حالة الفريق يدوياً', 'info');
  } catch (e) {
    feedReachable = false;
    if (lastFeedPayload) applyLiveFeed(lastFeedPayload);
    else updateHudKPIs();
  }
}

function celebrateBot(bot, text, withConfetti) {
  if (!bot) return;
  for (const k of BOT_KEYS) {
    const other = BOTS[k];
    if (other && other !== bot) {
      other.bubbleUntil = 0;
      other.bubbleText = '';
      clearChat(other);
    }
  }
  bot.bubbleText = Array.from(String(text)).slice(0, 52).join('');
  bot.bubbleUntil = performance.now() + 5000;
  if (withConfetti) spawnConfettiBurst(bot.x, bot.y);
}

// ================= V4: Office Event Queue (ONE event at a time) =================
// The old code has a single tripBot and a single interaction — stacking five
// random scenarios on top would strand bots mid-office. Everything comedic
// goes through this queue, and every trigger is gated on REAL feed data.
let officeEventQueue = [];
let officeEventActive = null;
let pizzaUntil = 0;
let lastPizzaMs = performance.now();
let prevServerAlarm = false;
let nextQuipAt = performance.now() + 90000;
let nextFazzaAt = performance.now() + 120000;
let demoActive = false;
let demoTimer = null;
let demoStepTimer = null;

const INSPECTION_EXCUSES = ['كنت بفكر في الحل يا كبير والله! 😅', 'السيستم كان بيعمل ريستارت!', 'كنت مستني الـ CI يا كبير!', 'دي استراحة محارب يا كبير!'];

function queueOfficeEvent(ev) {
  if (!ev || !ev.kind) return;
  for (const q of officeEventQueue) if (q.kind === ev.kind && q.botId === ev.botId) return; // no duplicates
  if (officeEventActive && officeEventActive.kind === ev.kind && officeEventActive.target && officeEventActive.target.id === ev.botId) return;
  if (officeEventQueue.length > 4) return; // never pile up
  officeEventQueue.push(ev);
}
function botNear(bot, x, y, d) { return Math.hypot(bot.x - x, bot.y - y) <= (d || 40); }
function routeBotHome(bot) { bot.returningHome = true; setBotRoute(bot, bot.homeX, bot.homeY); }

function startOfficeEvent(ev, now) {
  if (ev.kind === 'marbouha') {
    const target = BOTS[ev.botId], m = BOTS.marbouha;
    if (!target || !m || target.id === 'marbouha' || m.onTrip || teamMeetingActive) return false;
    officeEventActive = { kind: 'marbouha', phase: 'go', bot: m, target: target, task: ev.task, until: now + 45000 };
    setBotRoute(m, target.x, target.y - 46);
    return true;
  }
  if (ev.kind === 'inspect') {
    const kb = BOTS.elkebir, sleeper = BOTS[ev.botId];
    if (!kb || !sleeper || !sleeper.isSleeping || kb.onTrip || teamMeetingActive) return false;
    officeEventActive = { kind: 'inspect', phase: 'go', bot: kb, target: sleeper, until: now + 45000 };
    setBotRoute(kb, sleeper.x, sleeper.y - 46);
    return true;
  }
  if (ev.kind === 'fazza') {
    const f = BOTS.fazza, j = BOTS.johnny;
    if (!f || !j || j.feedStatus !== 'working' || f.onTrip || teamMeetingActive) return false;
    officeEventActive = { kind: 'fazza', phase: 'go', bot: f, target: j, until: now + 45000 };
    setBotRoute(f, j.x, j.y - 46);
    return true;
  }
  return false;
}

function finishOfficeEvent(ev) {
  if (ev.bot) routeBotHome(ev.bot);
  officeEventActive = null;
}

function updateOfficeEvents(time) {
  const now = performance.now();
  // Server alarm — log once when it STARTS (real data only, see isServerAlarm)
  const alarm = isServerAlarm();
  if (alarm && !prevServerAlarm) {
    addOfficeLog('🚨 السيرفر منوّر أحمر — البث فاصل أو فيه بوت متأخر أكتر من ٤٥ دقيقة', 'info');
    const fixer = BOTS.fazza.feedStatus === 'idle' ? BOTS.fazza : BOTS.ashraf;
    if (fixer) celebrateBot(fixer, 'مين عمل Push على الـ Production؟! 😱', false);
  }
  prevServerAlarm = alarm;

  if (officeEventActive) {
    const ev = officeEventActive;
    if (now > ev.until) { finishOfficeEvent(ev); return; }
    if (ev.phase === 'go' && ev.bot && ev.target && botNear(ev.bot, ev.target.x, ev.target.y - 46, 40)) {
      ev.phase = 'talk';
      ev.until = now + 5000;
      if (ev.kind === 'marbouha') {
        celebrateBot(ev.bot, 'استنى يا خويا.. أنا طلعتلك ٣ باجز من تحت الأرض 🔎', false);
        addOfficeLog('🔎 مربوحة بتراجع شغل ' + ev.target.name + ' بعد ما خلّص: ' + (ev.task || ''), 'info');
      } else if (ev.kind === 'inspect') {
        if (ev.target.isSleeping) wakeUpBot(ev.target);
        const excuse = INSPECTION_EXCUSES[Math.floor(Math.random() * INSPECTION_EXCUSES.length)];
        celebrateBot(ev.target, excuse, false);
        addOfficeLog('🚨 الكبير مسك ' + ev.target.name + ' نايم في جولة تفتيش!', 'info');
      } else if (ev.kind === 'fazza') {
        celebrateBot(ev.bot, 'مفيش ولا مليم ناقص ✅', false);
        addOfficeLog('🔍 فزاع راجع على مكتب جوني: مفيش ولا مليم ناقص', 'info');
      }
    } else if (ev.phase === 'talk' && now > ev.until) {
      finishOfficeEvent(ev);
    }
    return;
  }

  if (teamMeetingActive || demoActive) return;
  if (officeEventQueue.length > 0) {
    startOfficeEvent(officeEventQueue.shift(), now);
    return;
  }

  // Ambient triggers — all gated on real state, spaced out
  if (now > nextQuipAt) {
    nextQuipAt = now + 90000 + Math.random() * 60000;
    if (BOTS.johnny.feedStatus === 'working') {
      celebrateBot(BOTS.johnny, 'محتاجين نعمل Pivot للـ Budget يا برو 💰', false);
    } else if (BOTS.hazalqom.wander) {
      celebrateBot(BOTS.hazalqom, 'ما نكبر اللوجو شوية ونخليه فسفوري؟ 🎨', false);
      const dev = BOT_KEYS.map(k => BOTS[k]).find(b => b.feedStatus === 'working' && b.id !== 'hazalqom');
      if (dev) setTimeout(() => celebrateBot(dev, 'امشي من هنا يا حزلقوم الله يباركلك! 😂', false), 2500);
    }
  }
  if (now > nextFazzaAt) {
    nextFazzaAt = now + 150000 + Math.random() * 60000;
    if (BOTS.johnny.feedStatus === 'working' && BOTS.fazza.feedStatus === 'idle') queueOfficeEvent({ kind: 'fazza' });
  }
  // Inspection tour: only when someone is actually asleep
  const sleeper = BOT_KEYS.map(k => BOTS[k]).find(b => b.isSleeping);
  if (sleeper && !BOTS.elkebir.onTrip) queueOfficeEvent({ kind: 'inspect', botId: sleeper.id });
  // Random pizza: at most once per 45 minutes, and never while one is on the counter
  if ((!pizzaUntil || now > pizzaUntil) && now - lastPizzaMs > 45 * 60 * 1000 && Math.random() < 0.005) triggerPizzaOrder();
}

// V4: كبسة المدير — wakes sleepers, everyone working types furiously for 20s
function triggerBossSweep() {
  if (teamMeetingActive) { addOfficeLog('🚨 الكبير مشغول في الاجتماع دلوقتي', 'info'); return; }
  const kb = BOTS.elkebir;
  addOfficeLog('🚨 الكبير نازل جولة تفتيش مفاجئة!', 'info');
  if (soundEnabled) { playTone(220, 0.15, 'square', 0.04); setTimeout(() => playTone(220, 0.15, 'square', 0.04), 180); }
  let firstSleeper = true;
  let wokeAnyone = false;
  for (const k of BOT_KEYS) {
    const b = BOTS[k];
    if (b.isSleeping) {
      wokeAnyone = true;
      wakeUpBot(b);
      if (firstSleeper) {
        firstSleeper = false;
        celebrateBot(b, INSPECTION_EXCUSES[Math.floor(Math.random() * INSPECTION_EXCUSES.length)], false);
        addOfficeLog('🚨 الكبير صحّى ' + b.name + ' في جولة التفتيش!', 'info');
      }
    } else if (b.feedStatus === 'working') {
      b.bossRushUntil = performance.now() + 20000;
    }
  }
  if (!kb.onTrip) {
    setBotRoute(kb, 450, 314);
    // V4.1: the sweep must be VISIBLE — camera rides with elkebir on his tour
    if (!STACKED_ON) setCamTarget(kb.x, kb.y, 1.8, null);
    if (!wokeAnyone) celebrateBot(kb, 'جولة تفتيش! الكل يشتغل! 🚨', false);
    setTimeout(() => { if (!teamMeetingActive) routeBotHome(kb); }, 12000);
  }
}

// V4: pizza — manual order or rare random event, max once per 15 min (manual)
function triggerPizzaOrder() {
  const now = performance.now();
  if (now - lastPizzaMs < 15 * 60 * 1000) { addOfficeLog('🍕 البيتزا لسه واصلة من شوية — استنى شوية 😄', 'info'); if (!STACKED_ON) focusRoom('coffee'); return; }
  lastPizzaMs = now;
  pizzaUntil = now + 60000;
  addOfficeLog('🍕 الأكل وصل! بيتزا على ترابيزة القهوة — اللي فاضي يتفضل 😋', 'coffee');
  // V4.1: show the pizza — jump the camera to the coffee corner
  if (!STACKED_ON) focusRoom('coffee');
  if (soundEnabled) playTone(880, 0.12, 'sine', 0.04);
}

// V4: Demo Mode — 60s scripted scenario with a clear FAKE banner; the real
// feed is frozen during it and restored (re-fetched) the second it ends.
function startDemoMode() {
  if (demoActive) return;
  demoActive = true;
  document.getElementById('demo-banner').hidden = false;
  addOfficeLog('🎬 الوضع التجريبي شغال 60 ثانية — بيانات وهمية للعرض فقط', 'info');
  const set = (id, status, pct, task) => {
    const b = BOTS[id]; if (!b) return;
    b.feedStatus = status; b.status = status; b.progress = pct;
    b.task = task; b.taskTitle = task; b.shortTask = task.slice(0, 22) + ' ' + pct + '%';
  };
  set('hagras', 'working', 82, 'مهمة تجريبية: إصلاح وهمي');
  set('salem', 'working', 64, 'مهمة تجريبية: تنفيذ وهمي');
  set('fazza', 'stuck', 40, 'مشكلة تجريبية');
  set('marbouha', 'working', 95, 'مراجعة تجريبية');
  set('johnny', 'working', 70, 'تدقيق تجريبي');
  updateHudKPIs();
  demoStepTimer = setTimeout(() => {
    if (!demoActive) return;
    celebrateBot(BOTS.marbouha, 'استنى يا خويا.. أنا طلعتلك ٣ باجز من تحت الأرض 🔎', false);
    set('fazza', 'working', 55, 'بيحل المشكلة التجريبية');
    updateHudKPIs();
  }, 30000);
  demoTimer = setTimeout(endDemoMode, 60000);
}
function endDemoMode() {
  if (!demoActive) return;
  demoActive = false;
  clearTimeout(demoTimer); clearTimeout(demoStepTimer);
  document.getElementById('demo-banner').hidden = true;
  addOfficeLog('🎬 خلص الوضع التجريبي — رجعنا للبيانات الحقيقية', 'info');
  fetchLiveFeed(true);
}

syncCanvasSizing();
rebuildStaticBgCache();
renderLogDrawer();
updateHudKPIs();
fetchLiveFeed(false);
setInterval(() => fetchLiveFeed(false), POLL_INTERVAL_MS);
setInterval(updateHudKPIs, 15000);
requestAnimationFrame(gameLoop);
