<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="dark" />
<meta name="robots" content="noindex, nofollow" />
<link rel="icon" href="data:," />
<title>مكتب ديجر v4.7 — Digger HQ</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #070b13;
    --panel: rgba(13, 21, 36, 0.88);
    --panel-solid: #0e1624;
    --line: rgba(148, 163, 184, 0.22);
    --text: #eef3f9;
    --muted: #9db1c7;
    --faint: #647d99;
    --sky: #38bdf8;
    --green: #22c55e;
    --amber: #f5a623;
    --red: #f4534e;
    --gold: #f2b33d;
    --purple: #c084fc;
  }

  * { box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100vh;
    height: 100dvh;
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  body {
    display: block;
    overflow: hidden;
    background:
      radial-gradient(1100px 480px at 85% -10%, rgba(56, 189, 248, 0.08), transparent 60%),
      radial-gradient(900px 420px at 8% 110%, rgba(242, 179, 61, 0.06), transparent 60%),
      var(--bg);
  }

  button { font-family: inherit; cursor: pointer; }
  button:focus-visible { outline: 2px solid var(--sky); outline-offset: 2px; }

  .stage-space {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    height: 100dvh;
  }

  .canvas-stage {
    position: absolute;
    inset: 0;
    overflow: hidden;
    background:
      radial-gradient(900px 420px at 50% 0%, rgba(30, 58, 138, 0.16), transparent 65%),
      #080e1a;
  }

  canvas#office-canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }

  /* ---------- Top Command HUD ---------- */
  .hud-bar {
    position: absolute;
    top: 10px;
    right: 12px;
    left: 12px;
    z-index: 60;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    row-gap: 6px;
    pointer-events: none;
    flex-wrap: wrap;
    overflow: visible;
  }

  .hud-group {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
    pointer-events: auto;
    min-width: 0;
  }

  .brand-pill {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 5px 11px;
    border-radius: 999px;
    background: var(--panel);
    border: 1px solid rgba(242, 179, 61, 0.35);
    backdrop-filter: blur(8px);
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
    font-size: 12px;
    font-weight: 700;
    color: #fef3c7;
  }

  .brand-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--amber);
    box-shadow: 0 0 8px var(--amber);
    flex-shrink: 0;
  }
  .brand-dot.live {
    background: var(--green);
    box-shadow: 0 0 8px var(--green);
  }
  .brand-dot.offline {
    background: var(--red);
    box-shadow: 0 0 8px var(--red);
  }

  .feed-meta {
    font-size: 10.5px;
    font-weight: 500;
    color: var(--muted);
    padding-right: 4px;
    border-right: 1px solid rgba(148, 163, 184, 0.22);
  }

  .kpi-strip {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 3px 6px;
    border-radius: 999px;
    background: var(--panel);
    border: 1px solid var(--line);
    backdrop-filter: blur(8px);
    font-size: 11px;
  }

  .kpi-chip {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 2px 7px;
    border-radius: 999px;
    font-weight: 600;
    color: var(--text);
  }
  .kpi-chip.work { color: #86efac; }
  .kpi-chip.stuck { color: #fca5a5; }
  .kpi-chip.idle { color: #fde68a; }

  .room-nav {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 3px;
    border-radius: 999px;
    background: var(--panel);
    border: 1px solid var(--line);
    backdrop-filter: blur(8px);
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
  }

  .room-btn {
    background: transparent;
    color: var(--muted);
    border: 1px solid transparent;
    border-radius: 999px;
    padding: 4px 9px;
    font-size: 11px;
    font-weight: 600;
    transition: all 0.16s ease;
    white-space: nowrap;
  }
  .room-btn:hover {
    color: var(--text);
    background: rgba(56, 189, 248, 0.12);
  }
  .room-btn.active {
    background: rgba(56, 189, 248, 0.2);
    border-color: rgba(56, 189, 248, 0.55);
    color: #e0f2fe;
  }

  .stage-control-btn {
    background: var(--panel);
    color: #f8fafc;
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 5px 11px;
    font-size: 11.5px;
    font-weight: 600;
    backdrop-filter: blur(8px);
    transition: all 0.16s ease;
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.3);
    white-space: nowrap;
  }
  .stage-control-btn:hover {
    background: rgba(30, 41, 59, 0.96);
    border-color: var(--sky);
    color: var(--sky);
  }
  .stage-control-btn.meeting-on {
    background: rgba(88, 28, 135, 0.9);
    border-color: var(--purple);
    color: #f3e8ff;
    box-shadow: 0 0 14px rgba(192, 132, 252, 0.4);
  }
  .stage-control-btn.icon-only {
    padding: 5px 9px;
    min-width: 32px;
    text-align: center;
  }

  /* ---------- Activity Log Drawer ---------- */
  .log-drawer {
    position: absolute;
    top: 56px;
    left: 12px;
    width: 280px;
    max-height: min(360px, 60vh);
    background: rgba(11, 18, 32, 0.94);
    border: 1px solid rgba(148, 163, 184, 0.26);
    border-radius: 12px;
    backdrop-filter: blur(10px);
    box-shadow: 0 18px 36px rgba(0, 0, 0, 0.55);
    z-index: 85;
    display: none;
    flex-direction: column;
    overflow: hidden;
  }
  .log-drawer.open { display: flex; }

  .log-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 9px 12px;
    border-bottom: 1px solid rgba(148, 163, 184, 0.16);
    font-size: 12px;
    font-weight: 700;
    color: #e2e8f0;
  }
  .log-list {
    overflow-y: auto;
    padding: 8px 10px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .log-item {
    font-size: 11px;
    line-height: 1.45;
    padding: 6px 8px;
    border-radius: 8px;
    background: rgba(30, 41, 59, 0.55);
    border-right: 2px solid var(--sky);
    color: #cbd5e1;
  }
  .log-item.cheer { border-right-color: var(--gold); }
  .log-item.meeting { border-right-color: var(--purple); }
  .log-item.coffee { border-right-color: var(--amber); }
  .log-item.done { border-right-color: var(--green); }
  .log-time {
    display: block;
    font-size: 9.5px;
    color: var(--faint);
    margin-top: 2px;
  }

  /* ---------- Agent Profile Popup Card ---------- */
  .agent-popup-card {
    position: absolute;
    width: 268px;
    background: rgba(11, 18, 32, 0.96);
    border: 1px solid rgba(148, 163, 184, 0.28);
    border-radius: 14px;
    box-shadow: 0 18px 40px rgba(0, 0, 0, 0.62), 0 0 0 1px rgba(56, 189, 248, 0.08);
    backdrop-filter: blur(12px);
    padding: 13px 14px;
    z-index: 100;
    color: #f8fafc;
    direction: rtl;
    text-align: right;
    pointer-events: auto;
  }

  .card-top {
    display: flex;
    align-items: center;
    gap: 10px;
    padding-bottom: 9px;
    margin-bottom: 9px;
    border-bottom: 1px solid rgba(148, 163, 184, 0.16);
  }

  .card-avatar {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid var(--sky);
    flex-shrink: 0;
    background: #1e293b;
  }

  .card-identity {
    flex: 1;
    min-width: 0;
  }
  .card-name {
    font-size: 14px;
    font-weight: 700;
    color: #ffffff;
    line-height: 1.2;
  }
  .card-role {
    font-size: 10.5px;
    color: var(--muted);
    margin-top: 2px;
    line-height: 1.3;
  }
  .card-close {
    background: rgba(30, 41, 59, 0.7);
    border: 1px solid rgba(148, 163, 184, 0.2);
    color: #94a3b8;
    font-size: 13px;
    width: 26px;
    height: 26px;
    border-radius: 8px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .card-close:hover { color: #ffffff; border-color: var(--sky); }

  .card-status-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 11.5px;
    font-weight: 700;
    margin-bottom: 6px;
  }

  .card-progress-track {
    width: 100%;
    height: 6px;
    border-radius: 999px;
    background: rgba(30, 41, 59, 0.9);
    overflow: hidden;
    margin-bottom: 9px;
  }
  .card-progress-fill {
    height: 100%;
    border-radius: 999px;
    transition: width 0.35s ease;
  }

  .card-details {
    font-size: 11px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    margin-bottom: 10px;
    color: #cbd5e1;
    line-height: 1.45;
  }
  .card-details strong { color: #f8fafc; font-weight: 600; }

  .card-recent {
    margin-top: 4px;
    padding-top: 6px;
    border-top: 1px dashed rgba(148, 163, 184, 0.18);
  }
  .card-recent-title {
    font-size: 10px;
    color: var(--muted);
    margin-bottom: 3px;
    font-weight: 600;
  }
  .card-recent-item {
    font-size: 10.5px;
    color: #a7f3d0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .card-actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
  }
  .card-btn {
    border: none;
    border-radius: 8px;
    padding: 7px 8px;
    font-size: 11.5px;
    font-weight: 700;
    transition: filter 0.15s ease, transform 0.1s ease;
  }
  .card-btn:hover { filter: brightness(1.1); }
  .card-btn:active { transform: scale(0.98); }
  .card-btn.cheer { background: #f59e0b; color: #0f172a; }
  .card-btn.coffee { background: #1e293b; color: #fde68a; border: 1px solid rgba(245, 166, 35, 0.35); }
  .card-btn.focus {
    grid-column: 1 / -1;
    background: rgba(56, 189, 248, 0.14);
    color: #7dd3fc;
    border: 1px solid rgba(56, 189, 248, 0.35);
    padding: 5px 8px;
    font-size: 11px;
  }

  .hint-pill {
    position: absolute;
    bottom: 104px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 40;
    padding: 4px 12px;
    border-radius: 999px;
    background: rgba(7, 11, 19, 0.72);
    border: 1px solid rgba(148, 163, 184, 0.18);
    color: var(--muted);
    font-size: 10.5px;
    pointer-events: none;
    backdrop-filter: blur(4px);
    white-space: nowrap;
  }

  @media (max-width: 960px) {
    .hud-bar .kpi-strip { display: none; }
    .hint-pill { display: none; }
  }

  @media (max-width: 640px) {
    .hud-bar .room-nav { display: none; }
    .stage-control-btn { padding: 4px 8px; font-size: 10.5px; }
    .brand-pill { padding: 4px 9px; font-size: 11px; }
    .log-drawer { width: calc(100vw - 24px); left: 12px; right: 12px; }
  }

  /* Portrait phones: sticky toolbar + stacked full-width rooms */
  @media (max-width: 640px) and (orientation: portrait) {
    html, body { height: auto; }
    body { overflow-y: auto; overflow-x: hidden; }
    .stage-space { position: static; width: 100%; height: auto; }
    .canvas-stage { position: relative; height: auto; overflow: visible; padding-top: 48px; }
    canvas#office-canvas { position: static; width: 100%; height: auto; }
    .hud-bar {
      position: fixed;
      top: 0;
      right: 0;
      left: 0;
      padding: 6px 8px;
      background: rgba(7, 11, 19, 0.92);
      border-bottom: 1px solid rgba(148, 163, 184, 0.18);
      backdrop-filter: blur(10px);
    }
    .log-drawer { position: fixed; top: 52px; }
  }
  /* ---- V4 additions ---- */
  /* V4.5: manager commands (right rail) + PR/status (left rail) in the empty
     side space; top bar keeps brand + room nav only. */
  .hud-nav-group { margin-inline: auto; }
  /* V4.7: rails centre in the space BELOW the top bar (z-60) — at 300px tall
     a stage-centred rail slides under the brand pill and the manager button
     becomes unclickable. +20px keeps its top clear of the bar. */
  .side-rail { display: none; position: absolute; top: calc(50% + 20px); transform: translateY(-50%); z-index: 45; }
  .side-rail-right { right: 14px; }
  .side-rail-left { left: 14px; }
  .show-side-rails .side-rail { display: flex; flex-direction: column; gap: 10px; }
  .room-nav.rail-rooms { flex-direction: column; gap: 6px; padding: 6px; border-radius: 16px; }
  .room-nav.rail-rooms .room-btn { width: 100%; text-align: center; padding: 7px 8px; }
  /* V4.7: all 6 rooms live in the right rail — the list scrolls on short
     screens instead of pushing the rail off the stage. The rail itself stays
     overflow:visible so the manager dropdown still opens freely. */
  .side-rail-right .rail-rooms { min-height: 0; max-height: calc(100vh - 190px); overflow-y: auto; scrollbar-width: thin; }
  @media (max-height: 380px) {
    .side-rail-right .rail-rooms { gap: 4px; padding: 4px; }
    .side-rail-right .rail-rooms .room-btn { padding: 5px 6px; font-size: 10.5px; }
  }
  .show-side-rails .hud-copy { display: none !important; }
  .side-rail-right .hud-group { flex-direction: column; align-items: stretch; gap: 6px; }
  .side-rail-right .manager-menu-btn { white-space: normal; line-height: 1.3; text-align: center; }
  /* rail dropdown opens toward the center, not off the stage edge */
  .side-rail-right .manager-menu-list { inset-inline-end: auto; left: auto; right: 0; }
  .side-rail-left .kpi-strip { flex-direction: column; align-items: stretch; padding: 6px; }
  .side-rail-left .kpi-chip { justify-content: center; }
  @media (max-width: 1180px) {
    .feed-meta { display: none; }
  }
  @media (max-width: 720px) {
    .hud-bar .room-nav { display: none; }
  }
  .kpi-chip { cursor: pointer; }
  .kpi-chip.pr { border-color: rgba(192, 132, 252, 0.4); }
  .manager-menu { position: relative; }
  .manager-menu-list { display: none; position: absolute; top: calc(100% + 6px); inset-inline-end: 0; min-width: 200px; background: rgba(13, 21, 36, 0.97); border: 1px solid rgba(148, 163, 184, 0.35); border-radius: 10px; padding: 6px; z-index: 30; box-shadow: 0 8px 24px rgba(0,0,0,0.45); }
  .manager-menu-list.open { display: block; }
  .manager-menu-item { display: block; width: 100%; text-align: start; background: transparent; border: 0; color: #e2e8f0; font: inherit; font-size: 13px; padding: 9px 10px; border-radius: 7px; cursor: pointer; }
  .manager-menu-item:hover { background: rgba(56, 189, 248, 0.16); }
  .manager-menu-item.meeting-on { color: #fbbf24; font-weight: 700; }
  .demo-banner { position: absolute; top: auto; bottom: 56px; left: 50%; transform: translateX(-50%); background: #7c2d12; color: #ffedd5; border: 1px solid #f59e0b; border-radius: 999px; padding: 6px 14px; font-size: 12.5px; font-weight: 700; z-index: 25; white-space: nowrap; }
  .hint-pill { transition: opacity 0.3s; }
</style>
</head>
<body>

  <main class="stage-space">
    <div class="canvas-stage" id="stage-wrapper">
      <canvas id="office-canvas"></canvas>

      <!-- Executive HUD Overlay: top bar holds brand + room nav only (V4.5).
           Manager commands + PR/status live in the side rails below. -->
      <div class="hud-bar">
        <div class="hud-group hud-brand-group">
          <div class="brand-pill" id="brand-status" title="حالة البث المباشر لمكتب ديجر">
            <span class="brand-dot" id="feed-dot"></span>
            <span>مكتب ديجر</span>
            <span class="feed-meta" id="feed-meta">جاري الاتصال…</span>
          </div>
          <div class="kpi-strip hud-copy">
            <span class="kpi-chip work kpi-work">🟢 0</span>
            <span class="kpi-chip stuck kpi-stuck">🔴 0</span>
            <span class="kpi-chip idle kpi-idle">☕ 9</span>
            <span class="kpi-chip pr kpi-pr" title="اضغط لعرض الـ PRs المفتوحة">🔀 PR 0</span>
          </div>
        </div>

        <div class="hud-group hud-nav-group hud-copy">
          <div class="room-nav" id="room-nav" role="tablist" aria-label="الغرف">
            <button class="room-btn active" data-room="full" type="button">🏢 الكل</button>
            <button class="room-btn" data-room="manager" type="button">👑 المدير</button>
            <button class="room-btn" data-room="dev" type="button">💻 التطوير</button>
            <button class="room-btn" data-room="meeting" type="button">👥 الاجتماعات</button>
            <button class="room-btn" data-room="coffee" type="button">☕ القهوة</button>
            <button class="room-btn" data-room="lounge" type="button">🎮 الألعاب</button>
          </div>
        </div>

        <div class="hud-group hud-controls-group hud-copy">
          <div class="manager-menu">
            <button class="stage-control-btn manager-menu-btn" type="button" aria-haspopup="true" aria-expanded="false">👑 أوامر المدير ▾</button>
            <div class="manager-menu-list" role="menu">
              <button class="manager-menu-item meeting-btn" type="button">👥 اجتماع الفريق</button>
              <button class="manager-menu-item boss-btn" type="button">🚨 كبسة المدير</button>
              <button class="manager-menu-item pizza-btn" type="button">🍕 اعزم الفريق</button>
              <button class="manager-menu-item demo-btn" type="button">🎬 الوضع التجريبي</button>
            </div>
          </div>
          <button class="stage-control-btn phase-btn" type="button" title="تغيير إضاءة المكتب">🕒 تلقائي</button>
          <button class="stage-control-btn log-btn" type="button" title="سجل أحداث المكتب">📰 السجل</button>
          <button class="stage-control-btn icon-only sound-btn" type="button" title="الأصوات التفاعلية">🔇</button>
          <button class="stage-control-btn icon-only refresh-btn" type="button" title="تحديث البيانات الآن">↻</button>
        </div>
      </div>

      <!-- V4.5: the problem buttons — manager commands (right rail) + PR/status
           (left rail) — live in the empty side space. Shown only when
           syncSideRails() measures a real gap; otherwise the top-bar copies
           above stay in use. -->
      <div class="side-rail side-rail-right" id="side-rail-right">
        <div class="hud-group rail-copy">
          <div class="manager-menu">
            <button class="stage-control-btn manager-menu-btn" type="button" aria-haspopup="true" aria-expanded="false">👑 أوامر المدير ▾</button>
            <div class="manager-menu-list" role="menu">
              <button class="manager-menu-item meeting-btn" type="button">👥 اجتماع الفريق</button>
              <button class="manager-menu-item boss-btn" type="button">🚨 كبسة المدير</button>
              <button class="manager-menu-item pizza-btn" type="button">🍕 اعزم الفريق</button>
              <button class="manager-menu-item demo-btn" type="button">🎬 الوضع التجريبي</button>
            </div>
          </div>
          <button class="stage-control-btn phase-btn" type="button" title="تغيير إضاءة المكتب">🕒 تلقائي</button>
          <button class="stage-control-btn log-btn" type="button" title="سجل أحداث المكتب">📰 السجل</button>
          <button class="stage-control-btn icon-only sound-btn" type="button" title="الأصوات التفاعلية">🔇</button>
          <button class="stage-control-btn icon-only refresh-btn" type="button" title="تحديث البيانات الآن">↻</button>
        </div>
        <div class="room-nav rail-rooms">
          <button class="room-btn active" data-room="full" type="button">🏢 الكل</button>
          <button class="room-btn" data-room="manager" type="button">👑 المدير</button>
          <button class="room-btn" data-room="dev" type="button">💻 التطوير</button>
          <button class="room-btn" data-room="meeting" type="button">👥 الاجتماعات</button>
          <button class="room-btn" data-room="coffee" type="button">☕ القهوة</button>
          <button class="room-btn" data-room="lounge" type="button">🎮 الألعاب</button>
        </div>
      </div>
      <div class="side-rail side-rail-left" id="side-rail-left">
        <div class="kpi-strip rail-copy">
          <span class="kpi-chip work kpi-work">🟢 0</span>
          <span class="kpi-chip stuck kpi-stuck">🔴 0</span>

// ---------- Optional Web Audio Subtle Sound FX (Muted by default) ----------
let soundEnabled = false;
let audioCtx = null;

function playTone(freq, duration, type, gainVal) {
  if (!soundEnabled) return;
  try {
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      audioCtx = new AC();
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type || 'sine';
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(gainVal || 0.04, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
  } catch (e) {}
}

// ---------- Activity Log System ----------
const activityLogs = [];
function addOfficeLog(text, kind) {
  const nowStr = new Date().toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });
  activityLogs.unshift({ text: text, kind: kind || 'info', time: nowStr });
  if (activityLogs.length > 24) activityLogs.pop();
  renderLogDrawer();
}

function renderLogDrawer() {
  const list = document.getElementById('log-list');
  if (!list) return;
  list.textContent = '';
  if (activityLogs.length === 0) {
    const empty = document.createElement('div');
    empty.className = 'log-item';
    empty.textContent = 'في انتظار أول أحداث المكتب…';
    list.appendChild(empty);
    return;
  }
  for (const item of activityLogs) {
    const el = document.createElement('div');
    el.className = 'log-item ' + item.kind;
    el.textContent = item.text;
    const t = document.createElement('span');
    t.className = 'log-time';
    t.textContent = item.time;
    el.appendChild(t);
    list.appendChild(el);
  }
}

};

const NAV_EDGES = {
  bull_l:       ['bull_c', 'lounge_door'],
  bull_c:       ['bull_l', 'bull_r', 'meeting_door'],
  bull_r:       ['bull_c', 'bull_aisle_r', 'boss_door', 'coffee_hall'],
  bull_aisle_r: ['bull_r'],
  boss_door:    ['bull_r'],
  lounge_door:  ['bull_l'],
  meeting_door: ['bull_c'],
  coffee_hall:  ['bull_r', 'coffee_door'],
  coffee_door:  ['coffee_hall']
};

function zoneOf(x, y) {
  if (y < 340) return x >= 640 ? 'manager' : 'bullpen';
  if (x < 290) return 'lounge';
  if (x < 610) return 'meeting';
  return 'coffee';
}

function entryNodeFor(zone, x, y) {
  if (zone === 'manager') return 'boss_door';
  if (zone === 'lounge') return 'lounge_door';
  if (zone === 'meeting') return 'meeting_door';
  if (zone === 'coffee') return 'coffee_door';
  // bullpen: pick nearest hallway node
  const candidates = ['bull_l', 'bull_c', 'bull_r'];
  let best = 'bull_c', bestD = Infinity;
  for (const id of candidates) {
    const n = NAV_NODES[id];
    const d = Math.hypot(x - n.x, y - n.y);
    if (d < bestD) { bestD = d; best = id; }
  }
  return best;
}

function buildWaypoints(fromX, fromY, toX, toY) {
  const zA = zoneOf(fromX, fromY);
  const zB = zoneOf(toX, toY);
  if (zA === zB) {
    // Inside bullpen, if moving across rows horizontally, pass through the clear middle aisle
    if (zA === 'bullpen' && Math.abs(fromY - toY) > 70 && Math.abs(fromX - toX) > 120) {
      return [{ x: fromX, y: 204 }, { x: toX, y: 204 }, { x: toX, y: toY }];
    }
    return [{ x: toX, y: toY }];
  }

  const startId = entryNodeFor(zA, fromX, fromY);
  const endId = entryNodeFor(zB, toX, toY);

  // BFS on the small 9-node graph
  const queue = [[startId]];
  const visited = new Set([startId]);
  let pathIds = [startId, endId];
  while (queue.length) {
    const cur = queue.shift();
    const last = cur[cur.length - 1];
    if (last === endId) { pathIds = cur; break; }
    for (const nxt of (NAV_EDGES[last] || [])) {
      if (!visited.has(nxt)) {
        visited.add(nxt);
        queue.push(cur.concat(nxt));
      }
    }
  }

  const pts = [];
  // If starting in Row 1 of bullpen, step into middle aisle cleanly first
  if (zA === 'bullpen' && fromY < 185) {
    pts.push({ x: fromX, y: 204 });
    pts.push({ x: NAV_NODES[startId].x, y: 204 });
  }
  for (const id of pathIds) {
    pts.push({ x: NAV_NODES[id].x, y: NAV_NODES[id].y });
  }
  // If ending in Row 1 of bullpen, approach from middle aisle
  if (zB === 'bullpen' && toY < 185) {
    pts.push({ x: NAV_NODES[endId].x, y: 204 });
    pts.push({ x: toX, y: 204 });
  }
  pts.push({ x: toX, y: toY });
  return pts;
}

function setBotRoute(bot, tx, ty) {
  bot.route = buildWaypoints(bot.x, bot.y, tx, ty);
}

function followRoute(bot, speed, dt) {
  if (!bot.route || bot.route.length === 0) {
    bot.isMoving = false;
    return true;
  }
  const wp = bot.route[0];
  const dx = wp.x - bot.x;
  const dy = wp.y - bot.y;
  const dist = Math.hypot(dx, dy);
  if (Math.abs(dx) > 1) bot.facing = dx >= 0 ? 1 : -1;
  if (dist < 3.5) {
    bot.x = wp.x;
    bot.y = wp.y;
    bot.route.shift();
    if (bot.route.length === 0) {
      bot.isMoving = false;
      return true;
    }
    return false;
  }
  bot.isMoving = true;
  bot.x += (dx / dist) * speed * dt;
  bot.y += (dy / dist) * speed * dt;
  return false;
}

function updateRoomButtonsUI() {
  const btns = document.querySelectorAll('.room-btn');
  btns.forEach(btn => {
    btn.classList.toggle('active', btn.dataset.room === camRoom);
  });
}

function setCamTarget(x, y, zoom, roomName) {
  followBotId = null; // V4: any manual navigation cancels follow mode
  introUntil = 0; // cancel intro ease immediately on user navigation
  zoom = Math.max(1, Math.min(2.6, zoom || 1));
  const hw = BASE_W / 2 / zoom;
  const hh = BASE_H / 2 / zoom;
  cam.tx = Math.max(hw, Math.min(BASE_W - hw, x));
  cam.ty = Math.max(hh, Math.min(BASE_H - hh, y));
  cam.tzoom = zoom;
  camRoom = roomName || null;
  updateRoomButtonsUI();
}

function focusRoom(roomKey) {
  const r = ROOMS[roomKey] || ROOMS.full;
  setCamTarget(r.x, r.y, r.zoom, r.name);
}

function updateCamera(dt) {
  // V4: follow mode — camera rides along with the followed bot
  if (followBotId && BOTS[followBotId] && !STACKED_ON) {
    const b = BOTS[followBotId];
    const z = Math.max(cam.tzoom, 1.8);
    const hw = BASE_W / 2 / z, hh = BASE_H / 2 / z;
    cam.tx = Math.max(hw, Math.min(BASE_W - hw, b.x));
    cam.ty = Math.max(hh, Math.min(BASE_H - hh, b.y));
    cam.tzoom = z;
  }
  if (REDUCED_MOTION) { cam.x = cam.tx; cam.y = cam.ty; cam.zoom = cam.tzoom; return; }
  const rate = performance.now() < introUntil ? 1.15 : 4.2;
  const f = 1 - Math.exp(-dt * rate);
  cam.x += (cam.tx - cam.x) * f;
  cam.y += (cam.ty - cam.y) * f;
  cam.zoom += (cam.tzoom - cam.zoom) * f;
}

function roomAt(x, y) {
  if (y < 340) return x >= 640 ? ROOMS.manager : ROOMS.dev;
  if (x < 290) return ROOMS.lounge;
  if (x < 610) return ROOMS.meeting;
  return ROOMS.coffee;
}

// ---------- Time-of-Day Lighting Phases ----------
const DAWN_PHASE   = { key: 'dawn',   sky: '#e8a37c', buildings: '#9a5a44', beam: 'rgba(255, 190, 120, 0.11)', tint: 'rgba(255, 170, 90, 0.05)', stars: false, slant: 58, lampBoost: 0.7 };
const DAY_PHASE    = { key: 'day',    sky: '#38bdf8', buildings: '#0284c7', beam: 'rgba(254, 240, 138, 0.065)', tint: null, stars: false, slant: 18, lampBoost: 0.45 };
const SUNSET_PHASE = { key: 'sunset', sky: '#f08a4b', buildings: '#7c2d12', beam: 'rgba(255, 145, 65, 0.14)', tint: 'rgba(255, 130, 50, 0.08)', stars: false, slant: -55, lampBoost: 0.85 };
const NIGHT_PHASE  = { key: 'night',  sky: '#0c2545', buildings: '#071529', beam: 'rgba(140, 180, 255, 0.055)', tint: 'rgba(7, 16, 48, 0.22)', stars: true, slant: 35, lampBoost: 1.3 };

function getClockPhase() {
  const now = new Date();
  const h = now.getHours() + now.getMinutes() / 60;
  if (h >= 5 && h < 7.5) return DAWN_PHASE;
  if (h >= 7.5 && h < 16.5) return DAY_PHASE;
  if (h >= 16.5 && h < 19.5) return SUNSET_PHASE;
  return NIGHT_PHASE;
}

const PHASE_MODES = [
  { id: 'auto',   label: '🕒 تلقائي' },
  { id: 'day',    label: '☀️ نهار' },
  { id: 'sunset', label: '🌅 غروب' },
  { id: 'night',  label: '🌙 ليل' }
];
let phaseModeIdx = 0;
let PHASE = getClockPhase();

function resolvePhase() {
  const mode = PHASE_MODES[phaseModeIdx].id;
  if (mode === 'day') return DAY_PHASE;
  if (mode === 'sunset') return SUNSET_PHASE;
  if (mode === 'night') return NIGHT_PHASE;
  return getClockPhase();
}

// ---------- Particles (Coffee Steam, Water Bubbles & Celebration Confetti) ----------
const particles = [];

function spawnConfettiBurst(x, y) {
  if (REDUCED_MOTION) return;
  const colors = ['#f59e0b', '#38bdf8', '#22c55e', '#f472b6', '#c084fc', '#fef08a'];
  for (let i = 0; i < 18; i++) {
    const angle = (Math.PI * 2 * i) / 18 + (Math.random() - 0.5) * 0.4;
    const speed = 0.8 + Math.random() * 1.9;
    particles.push({
      x: x, y: y - 18,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed - 1.3,
      gravity: 0.055,
      size: 2.2 + Math.random() * 2,
      color: colors[i % colors.length],
      life: 1,
      decay: 0.018 + Math.random() * 0.012
    });
  }
}

function spawnParticles() {
  if (REDUCED_MOTION) return;
  // Espresso machine steam
  if (Math.random() < 0.34) {
    particles.push({
      x: 702 + (Math.random() * 12 - 6), y: 348,
      vx: (Math.random() - 0.5) * 0.25, vy: -0.5 - Math.random() * 0.4,
      gravity: 0,
      size: 1.8 + Math.random() * 1.6,
      color: 'rgba(240, 245, 255, 0.52)',
      life: 1, decay: 0.018
    });
  }
  // Water cooler bubble
  if (Math.random() < 0.14) {
    particles.push({
      x: 604 + (Math.random() * 8 - 4), y: 82,
      vx: 0, vy: -0.45,
      gravity: 0,
      size: 1.5,
      color: 'rgba(255, 255, 255, 0.72)',
      life: 1, decay: 0.03
    });
  }
}

function updateParticles() {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    if (p.gravity) p.vy += p.gravity;
    p.life -= p.decay;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

function drawParticles() {
  for (const p of particles) {
    ctx.fillStyle = p.color;
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillRect(Math.floor(p.x), Math.floor(p.y), p.size, p.size);
  }
  ctx.globalAlpha = 1.0;
}

// ---------- Static Floor & Architecture Builder (Cached to Offscreen Canvas!) ----------
function drawParquetFloorTo(c, x, y, w, h) {
  const tileSize = 36;
  const plankH = 9;
  const colors = ['#b28a5f', '#a87f56', '#9c744c', '#b89368', '#997048'];
  for (let py = y; py < y + h; py += plankH) {
    const rowIndex = Math.floor(py / plankH);
    for (let px = x; px < x + w; px += tileSize) {
      const offset = (rowIndex % 2 === 0) ? 0 : 18;
      const actualX = px - offset;
      const colIndex = Math.floor(actualX / tileSize);
      const col = colors[Math.abs((rowIndex * 3 + colIndex * 7) % colors.length)];
      const drawX = Math.max(x, actualX);
      const drawW = Math.min(x + w - drawX, tileSize - (drawX - actualX));
      if (drawW > 0) {
        c.fillStyle = col;
        c.fillRect(drawX, py, drawW, plankH);
        c.fillStyle = 'rgba(70, 40, 20, 0.16)';
        c.fillRect(drawX, py + plankH - 1, drawW, 1);
        c.fillRect(drawX + drawW - 1, py, 1, plankH);
      }
    }
  }
  // Subtle runner carpet strip in main corridor
  c.fillStyle = 'rgba(15, 23, 42, 0.14)';
  c.fillRect(x + 12, 304, w - 24, 24);
}

function drawExecutiveFloorTo(c, x, y, w, h) {
  const plankH = 11;
  const woodColors = ['#452214', '#3d1c10', '#4e2918', '#38180c'];
  for (let py = y; py < y + h; py += plankH) {
    const r = Math.floor(py / plankH);
    c.fillStyle = woodColors[r % woodColors.length];
    c.fillRect(x, py, w, plankH);
    c.fillStyle = 'rgba(0, 0, 0, 0.35)';
    c.fillRect(x, py + plankH - 1, w, 1);
  }

  // Persian Executive Rug
  const rugX = x + 36;
  const rugY = y + 36;
  const rugW = w - 72;
  const rugH = h - 72;

  c.fillStyle = '#fef08a';
  for (let fx = rugX; fx < rugX + rugW; fx += 5) {
    c.fillRect(fx, rugY - 3, 2, 3);
    c.fillRect(fx, rugY + rugH, 2, 3);
  }

  c.fillStyle = '#701a35';
  c.fillRect(rugX, rugY, rugW, rugH);

  c.strokeStyle = '#eab308';
  c.lineWidth = 4;
  c.strokeRect(rugX + 4, rugY + 4, rugW - 8, rugH - 8);

  c.strokeStyle = '#1e3a8a';
  c.lineWidth = 2;
  c.strokeRect(rugX + 10, rugY + 10, rugW - 20, rugH - 20);

  c.fillStyle = '#991b1b';
  for (let rx = rugX + 18; rx < rugX + rugW - 18; rx += 22) {
    for (let ry = rugY + 18; ry < rugY + rugH - 18; ry += 22) {
      c.fillRect(rx, ry, 6, 6);
      c.fillStyle = '#fbbf24';
      c.fillRect(rx + 2, ry + 2, 2, 2);
      c.fillStyle = '#991b1b';
    }
  }

  const cx = rugX + rugW / 2;
  const cy = rugY + rugH / 2;
  c.fillStyle = '#1e3a8a';
  c.beginPath();
  c.moveTo(cx, cy - 30);
  c.lineTo(cx + 50, cy);
  c.lineTo(cx, cy + 30);
  c.lineTo(cx - 50, cy);
  c.closePath();
  c.fill();
  c.strokeStyle = '#facc15';
  c.lineWidth = 2;
  c.stroke();

  c.fillStyle = '#f59e0b';
  c.fillRect(cx - 10, cy - 10, 20, 20);
  c.fillStyle = '#dc2626';
  c.fillRect(cx - 5, cy - 5, 10, 10);
  c.fillStyle = '#fef08a';
  c.fillRect(cx - 2, cy - 2, 4, 4);
}

function drawCheckeredFloorTo(c, x, y, w, h) {
  const size = 20;
  const tileA = '#7c4034';
  const tileB = '#d9cfb8';
  for (let py = y; py < y + h; py += size) {
    for (let px = x; px < x + w; px += size) {
      const isEven = (Math.floor(px / size) + Math.floor(py / size)) % 2 === 0;
      c.fillStyle = isEven ? tileA : tileB;
      const tw = Math.min(size, x + w - px);
      const th = Math.min(size, y + h - py);
      c.fillRect(px, py, tw, th);
      c.fillStyle = 'rgba(0, 0, 0, 0.18)';
      c.fillRect(px, py + th - 1, tw, 1);
      c.fillRect(px + tw - 1, py, 1, th);
    }
  }
}

function drawLoungeFloorTo(c, x, y, w, h) {
  c.fillStyle = PAL.lounge;
  c.fillRect(x, y, w, h);

  c.fillStyle = 'rgba(20, 184, 166, 0.08)';
  for (let d = -h; d < w; d += 18) {
    c.beginPath();
    c.moveTo(x + d, y);
    c.lineTo(x + d + 9, y);
    c.lineTo(x + d + 9 + h, y + h);
    c.lineTo(x + d + h, y + h);
    c.closePath();
    c.fill();
  }

  const rx = x + 18, ry = y + 20, rw = w - 36, rh = h - 40;
  c.fillStyle = PAL.loungeRug;
  c.fillRect(rx, ry, rw, rh);
  c.strokeStyle = PAL.loungeLine;
  c.lineWidth = 2;
  c.strokeRect(rx + 4, ry + 4, rw - 8, rh - 8);
}

function drawMeetingFloorTo(c, x, y, w, h) {
  c.fillStyle = '#1e293b';
  c.fillRect(x, y, w, h);

  const tileSize = 22;
  c.strokeStyle = 'rgba(15, 23, 42, 0.55)';
  c.lineWidth = 1;
  for (let px = x; px <= x + w; px += tileSize) {
    c.beginPath(); c.moveTo(px, y); c.lineTo(px, y + h); c.stroke();
  }
  for (let py = y; py <= y + h; py += tileSize) {
    c.beginPath(); c.moveTo(x, py); c.lineTo(x + w, py); c.stroke();
  }

  const rx = x + 22, ry = y + 24, rw = w - 44, rh = h - 48;
  c.fillStyle = '#0f172a';
  c.fillRect(rx, ry, rw, rh);
  c.strokeStyle = '#334155';
  c.lineWidth = 2;
  c.strokeRect(rx + 4, ry + 4, rw - 8, rh - 8);

  // Executive gold corners
  c.fillStyle = '#f59e0b';
  const bs = 10;
  c.fillRect(rx + 6, ry + 6, bs, 2); c.fillRect(rx + 6, ry + 6, 2, bs);
  c.fillRect(rx + rw - 6 - bs, ry + 6, bs, 2); c.fillRect(rx + rw - 8, ry + 6, 2, bs);
  c.fillRect(rx + 6, ry + rh - 8, bs, 2); c.fillRect(rx + 6, ry + rh - 6 - bs, 2, bs);
  c.fillRect(rx + rw - 6 - bs, ry + rh - 8, bs, 2); c.fillRect(rx + rw - 8, ry + rh - 6 - bs, 2, bs);
}

// ---------- Helpers: Board Titles & Soft Contact Shadow ----------
function cleanBoardTaskTitle(b) {
  if (!b) return '';
  let raw = b.task_title || b.taskTitle || '';
  if (!raw && b.task && !b.task.includes('بدون تحديث') && b.task !== 'مهمة قيد التنفيذ' && b.task !== 'في انتظار البث المباشر...') {
    raw = b.task;
  }
  if (!raw) raw = b.taskId || b.task || b.shortTask || '';
  return String(raw)
    .replace(/\s*🔴\s*متأخر/gu, '')
    .replace(/\s*متأخر/gu, '')
    .replace(/\s*بدون تحديث.*/gu, '')
    .replace(/\s+\d+%$/gu, '')
    .trim();
}

function fitBoardTitle(context, name, rawTitle, availWidth) {
  const prefix = name ? name + ': ' : '';
  const full = prefix + rawTitle;
  if (context.measureText(full).width <= availWidth) return full;
  let cut = rawTitle;
  while (cut.length > 0 && context.measureText(prefix + cut + '…').width > availWidth) {
    cut = cut.slice(0, -1);
  }
  if (cut.length === 0 && context.measureText(prefix + '…').width > availWidth) {
    let pCut = prefix;
    while (pCut.length > 0 && context.measureText(pCut + '…').width > availWidth) {
      pCut = pCut.slice(0, -1);
    }
    return pCut ? pCut + '…' : '…';
  }
  return prefix + cut + '…';
}

function softContactShadow(cx, cy, rx, ry, alpha) {
  const g = ctx.createRadialGradient(cx, cy, 1, cx, cy, rx);
  g.addColorStop(0, 'rgba(0, 0, 0, ' + alpha + ')');
  g.addColorStop(1, 'rgba(0, 0, 0, 0)');
  ctx.save();
  ctx.translate(cx, cy);
  ctx.scale(1, ry / rx);
  ctx.translate(-cx, -cy);
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(cx, cy, rx, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function drawDeskNameplate(cx, y, name, isGold) {
  const ns = STACKED_ON ? 1.55 : 1;
  ctx.font = '700 ' + (7 * ns) + 'px "IBM Plex Sans Arabic", Tahoma, sans-serif';
  const w = ctx.measureText(name).width + 12 * ns;
  ctx.fillStyle = isGold ? '#f59e0b' : '#1e293b';
  ctx.fillRect(cx - w / 2, y, w, 8.8 * ns);
  ctx.strokeStyle = isGold ? '#fef08a' : '#d4af37';
  ctx.lineWidth = 0.8;
  ctx.strokeRect(cx - w / 2, y, w, 8.8 * ns);
  ctx.fillStyle = isGold ? '#291502' : '#fde68a';
  ctx.textAlign = 'center';
  ctx.fillText(name, cx, y + 6.9 * ns);
}

// ---------- V4: Live Screen Text — REAL feed data only ----------
// The old snippet dict held invented PR/bug/coverage lines. Screens now type the bot's REAL
// task_id / task title / step from the live feed. No task = blank screen.
function screenLinesFor(bot) {
  const lines = [];
  if (bot.taskId) lines.push(String(bot.taskId).slice(0, 24));
  const title = String(bot.taskTitle || bot.task || '').trim();
  if (title) lines.push(title.slice(0, 24));
  if (bot.step) lines.push(String(bot.step).slice(0, 24));
  return lines;
}

function updateBotCode(bot, dt) {
  if (!bot.code) bot.code = { lines: [], cur: '', li: 0, acc: 0 };
  if (bot.feedStatus === 'idle' || bot.isSleeping) { bot.code.acc = 0; return; }
  const pool = screenLinesFor(bot);
  if (pool.length === 0) { bot.code.acc = 0; return; }
  const rush = (bot.bossRushUntil && performance.now() < bot.bossRushUntil) ? 3 : 1; // V4: كبسة المدير
  const cps = (bot.feedStatus === 'stuck' ? 1.1 : bot.charsPerSec) * rush;
  bot.code.acc += dt * cps;
  while (bot.code.acc >= 1) {
    bot.code.acc -= 1;
    const target = pool[bot.code.li % pool.length];
    if (bot.code.cur.length < target.length) {
      bot.code.cur += target.charAt(bot.code.cur.length);
    } else {
      bot.code.lines.push(bot.code.cur);
      if (bot.code.lines.length > 6) bot.code.lines.shift();
      bot.code.cur = '';
      bot.code.li++;
    }
  }
}

function drawBotScreen(bot, x, y, w, h, variant) {
  const st = bot ? bot.feedStatus : 'idle';
  if (st === 'stuck') ctx.fillStyle = '#2c0d10';
  else if (st === 'working') ctx.fillStyle = '#0a1526';
  else ctx.fillStyle = '#0b1120';
  ctx.fillRect(x, y, w, h);
  if (!bot) return;

  if (st === 'idle') {
    if (Math.floor(performance.now() / 900) % 2 === 0) {
      ctx.fillStyle = 'rgba(245, 166, 35, 0.55)';
      ctx.fillRect(x + w / 2 - 1, y + h / 2 - 1, 2, 2);
    }
    return;
  }

  // Subtle screen glow onto desk surface (stronger at night)
  const glowAlpha = (st === 'stuck' ? 0.16 : 0.11) * (PHASE.lampBoost || 1);
  ctx.fillStyle = st === 'stuck'
    ? 'rgba(239, 68, 68, ' + glowAlpha.toFixed(2) + ')'
    : 'rgba(56, 189, 248, ' + glowAlpha.toFixed(2) + ')';
  ctx.fillRect(x - 2, y + h + 2, w + 4, 8);

  const pct = Math.max(0, Math.min(100, bot.progress || 0));
  const barColor = st === 'stuck'
    ? (Math.floor(performance.now() / 500) % 2 === 0 ? '#f87171' : '#ef4444')
    : (st === 'waiting' ? '#38bdf8' : '#22c55e');

  if (variant === 1) {
    ctx.font = 'bold 6.5px monospace';
    ctx.textAlign = 'center';
    ctx.fillStyle = st === 'stuck' ? '#fca5a5' : (st === 'waiting' ? '#bae6fd' : '#a7f3d0');
    ctx.fillText(pct + '%', x + w / 2, y + 7.5);
    ctx.fillStyle = '#1e293b';
    ctx.fillRect(x + 2, y + h - 3.5, w - 4, 2);
    ctx.fillStyle = barColor;
    ctx.fillRect(x + 2, y + h - 3.5, (w - 4) * pct / 100, 2);
    ctx.textAlign = 'left';
    return;
  }

  const code = bot.code || { lines: [], cur: '' };
  const prev = code.lines.length ? code.lines[code.lines.length - 1] : '';
  ctx.font = '4.4px monospace';
  ctx.textAlign = 'left';
  ctx.fillStyle = st === 'stuck' ? 'rgba(252, 165, 165, 0.5)' : 'rgba(125, 211, 252, 0.52)';
  if (prev) ctx.fillText(prev, x + 1.5, y + 4.2, w - 3);
  ctx.fillStyle = st === 'stuck' ? '#fca5a5' : '#bae6fd';
  ctx.fillText(code.cur || '', x + 1.5, y + 8.8, w - 3);
  if (Math.floor(performance.now() / 450) % 2 === 0) {
    const tw = Math.min(ctx.measureText(code.cur || '').width, w - 5);
    ctx.fillStyle = st === 'stuck' ? '#ef4444' : '#38bdf8';
    ctx.fillRect(x + 2 + tw, y + 5.8, 1.6, 3);
  }
  ctx.fillStyle = 'rgba(30, 41, 59, 0.9)';
  ctx.fillRect(x, y + h - 2, w, 2);
  ctx.fillStyle = barColor;
  ctx.fillRect(x, y + h - 2, w * pct / 100, 2);
}

// V4: real server alarm — feed down, or any bot stale-stuck > 45 min.
// NEVER random: a red server must always mean something real.
function isServerAlarm() {
  if (!feedInitialized) return false;
  if (!feedReachable) return true;
  return BOT_KEYS.some(k => {
    const b = BOTS[k];
    return b.feedStatus === 'stuck' && b.updatedAt && (Date.now() - Date.parse(b.updatedAt)) > STALE_AFTER_MS;
  });
}

  ctx.fillStyle = '#475569'; ctx.fillRect(fx + 23, fy + 6, 2, 7); ctx.fillRect(fx + 23, fy + 22, 2, 10);
  ctx.fillStyle = '#facc15'; ctx.fillRect(fx + 5, fy + 23, 5, 5);
  ctx.fillStyle = '#38bdf8'; ctx.fillRect(fx + 12, fy + 26, 5, 5);
  ctx.fillStyle = '#f472b6'; ctx.fillRect(fx + 7, fy + 33, 5, 5);

  // Bistro Table & 2 Chairs
  const tx = 860, ty = 500;
  for (const cx of [tx - 32, tx + 32]) {
    softContactShadow(cx, ty + 6, 10, 4, 0.3);
    ctx.fillStyle = '#78350f'; ctx.beginPath(); ctx.arc(cx, ty, 9, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#9a3412'; ctx.beginPath(); ctx.arc(cx, ty - 1, 6.5, 0, Math.PI * 2); ctx.fill();
  }
  softContactShadow(tx, ty + 20, 24, 6, 0.35);
  ctx.fillStyle = '#78350f'; ctx.beginPath(); ctx.arc(tx, ty, 22, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#9a3412'; ctx.beginPath(); ctx.arc(tx, ty, 18, 0, Math.PI * 2); ctx.fill();

  // Corner Plants (Zero contact with any desk!)
  drawPixelPlant(16, 294);
  drawPixelPlant(656, 66);
  drawPixelPlant(924, 292);
  drawPixelPlant(14, 554);
  drawPixelPlant(924, 554);
}

// ---------- Canvas-Anchored Room Labels (Follow Zoom & Never Float in Letterbox!) ----------
const ROOM_LABELS = [
  { x: 320, y: 66,  text: '💻 صالة التطوير والهندسة', color: '#7dd3fc', border: 'rgba(56,189,248,.55)' },
  { x: 800, y: 66,  text: '👑 غرفة المدير «الكبير»', color: '#ffd97a', border: 'rgba(242,179,61,.6)' },
  { x: 145, y: 583, text: '🎮 ركن الألعاب والاستراحة', color: '#5eead4', border: 'rgba(45,212,191,.55)' },
  { x: 450, y: 583, text: '👥 قاعة الاجتماعات', color: '#d8b4fe', border: 'rgba(192,132,252,.55)' },
  { x: 785, y: 583, text: '☕ ركن القهوة والمطبخ', color: '#fbbf24', border: 'rgba(245,166,35,.55)' }
];

function drawCanvasRoomLabels() {
  if (STACKED_ON) return; // portrait stacked mode uses its own full-width strip titles
  ctx.save();
  ctx.font = '700 10.5px "IBM Plex Sans Arabic", Tahoma, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for (const r of ROOM_LABELS) {
    const tw = ctx.measureText(r.text).width;
    const pw = tw + 20, ph = 20;
    const x0 = r.x - pw / 2, y0 = r.y - ph / 2;
    const rad = ph / 2;
    ctx.beginPath();
    ctx.moveTo(x0 + rad, y0);
    ctx.arcTo(x0 + pw, y0, x0 + pw, y0 + ph, rad);
    ctx.arcTo(x0 + pw, y0 + ph, x0, y0 + ph, rad);
    ctx.arcTo(x0, y0 + ph, x0, y0, rad);
    ctx.arcTo(x0, y0, x0 + pw, y0, rad);
    ctx.closePath();
    ctx.fillStyle = 'rgba(7, 11, 19, 0.82)';
    ctx.fill();
    ctx.strokeStyle = r.border;
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.fillStyle = r.color;
    ctx.fillText(r.text, r.x, r.y + 0.5);
  }
  ctx.restore();
}

// ---------- Bot Entity & Layered Speech Bubbles (Zero Overlapping Clutter!) ----------
function isBotAtOwnDesk(bot) {
  if (bot.isMoving || bot.onTrip || bot.returningHome || teamMeetingActive || bot.atMeetingSeat) return false;
  if (bot.baseWander && bot.wander) return false;
  return Math.hypot(bot.x - bot.homeX, bot.y - bot.homeY) < 8;
}

// V4: per-character outfit details (the faces are high-res photos, the
// bodies were flat colour blocks — this closes that gap)
function drawOutfitDetails(bot, bx, torsoTop) {
  if (bot.id === 'elkebir') { // suit: gold tie + white collar
    ctx.fillStyle = '#fbbf24'; ctx.fillRect(bx - 1.5, torsoTop + 2, 3, 14);
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.fillRect(bx - 6, torsoTop + 1, 3, 6); ctx.fillRect(bx + 3, torsoTop + 1, 3, 6);
  } else if (bot.id === 'johnny') { // hoodie: pocket + drawstrings
    ctx.fillStyle = 'rgba(0,0,0,0.25)'; ctx.fillRect(bx - 8, torsoTop + 12, 16, 6);
    ctx.fillStyle = '#f8fafc';
    ctx.fillRect(bx - 3, torsoTop + 2, 1.5, 6); ctx.fillRect(bx + 1.5, torsoTop + 2, 1.5, 6);
  } else if (bot.id === 'hazalqom') { // paint splashes
    ctx.fillStyle = '#ec4899'; ctx.fillRect(bx - 9, torsoTop + 6, 3, 3);
    ctx.fillStyle = '#38bdf8'; ctx.fillRect(bx + 7, torsoTop + 10, 3, 3);
    ctx.fillStyle = '#fbbf24'; ctx.fillRect(bx + 2, torsoTop + 14, 3, 3);
  } else { // collar line for everyone else
    ctx.strokeStyle = 'rgba(0,0,0,0.28)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(bx - 8, torsoTop + 3); ctx.lineTo(bx + 8, torsoTop + 3); ctx.stroke();
  }
}

function drawBotEntity(bot, time) {
  const isHovered = (hoveredBotId === bot.id) || (selectedCardBotId === bot.id);
  const atOwnDesk = isBotAtOwnDesk(bot);
  const seated = atOwnDesk || (teamMeetingActive && bot.atMeetingSeat);

  ctx.save();

  const bx = Math.floor(bot.x);
  const by = Math.floor(bot.y);

  // Waking Jump + Spin Animation
  if (bot.wakeAnimStart && (time - bot.wakeAnimStart < 750)) {
    const wProg = (time - bot.wakeAnimStart) / 750;
    const jumpY = -14 * Math.sin(wProg * Math.PI);
    const spinAngle = wProg * Math.PI * 2;
    ctx.translate(bx, by + jumpY);
    ctx.rotate(spinAngle);
    ctx.translate(-bx, -by);
  }

  const headR = 13.5;
  let headCenterY;

  // Active Speaker Halo during Team Meeting or Hover Ring
  const isSpeaking = (bot.chatUntil && time < bot.chatUntil) || (bot.bubbleUntil && time < bot.bubbleUntil);
  if (isHovered || (teamMeetingActive && isSpeaking)) {
    ctx.strokeStyle = teamMeetingActive && isSpeaking ? '#c084fc' : '#38bdf8';
    ctx.lineWidth = 2;
    ctx.setLineDash([4, 3]);
    ctx.beginPath();
    ctx.ellipse(bx, by + 24, 26, 11, 0, 0, Math.PI * 2);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  softContactShadow(bx, by + 24, 20, 7, 0.4);

  if (seated) {
    // Chair back behind employee
    const leather = bot.deskType === 'executive';
    ctx.fillStyle = leather ? '#241105' : '#0b1220';
    ctx.beginPath(); ctx.arc(bx, by - 12, 16.5, Math.PI, 0); ctx.fill();
    ctx.fillRect(bx - 16.5, by - 12, 33, 25);
    ctx.fillStyle = leather ? '#5a3016' : '#22314e';
    ctx.beginPath(); ctx.arc(bx, by - 12, 13.5, Math.PI, 0); ctx.fill();
    ctx.fillRect(bx - 13.5, by - 12, 27, 21);
    if (leather) {
      ctx.fillStyle = '#3a1e0c';
      ctx.fillRect(bx - 7.5, by - 9, 2.5, 2.5);
      ctx.fillRect(bx + 5, by - 9, 2.5, 2.5);
      ctx.fillRect(bx - 1.2, by - 4, 2.5, 2.5);
    }

    const activeWork = atOwnDesk && bot.feedStatus === 'working';
    const bob = (activeWork && !REDUCED_MOTION) ? Math.sin(time * 0.005 * (bot.rhythm || 1) + bx) * 0.85 : 0;
    const sleepNod = bot.isSleeping ? (2.8 + Math.sin(time * 0.0022 + bx) * 1.1) : 0;
    const torsoTop = by - 6 + bob;
    headCenterY = torsoTop - headR - 1 + sleepNod;

    // Torso
    ctx.fillStyle = bot.shirtColor;
    ctx.beginPath(); ctx.arc(bx, torsoTop, 14.5, Math.PI, 0); ctx.fill();
    ctx.fillRect(bx - 14.5, torsoTop, 29, 22);
    ctx.fillStyle = bot.accentColor;
    ctx.fillRect(bx - 4, torsoTop + 4, 8, 3);
    drawOutfitDetails(bot, bx, torsoTop); // V4

    // Arms
    const typing = atOwnDesk && (bot.feedStatus === 'working' || bot.feedStatus === 'stuck') && !REDUCED_MOTION;
    const typeSpd = bot.feedStatus === 'stuck' ? 0.008 : 0.03 * (bot.rhythm || 1);
    const typeAmp = bot.feedStatus === 'stuck' ? 0.6 : 1.4;
    const tA = typing ? Math.sin(time * typeSpd + bx) * typeAmp : 0;
    const tB = typing ? Math.cos(time * typeSpd * 0.9 + bx) * typeAmp : 0;
    ctx.fillStyle = bot.shirtColor;
    ctx.fillRect(bx - 18.5, torsoTop + 3, 5, 11);
    ctx.fillRect(bx + 13.5, torsoTop + 3, 5, 11);
    ctx.fillRect(bx - 16.5, torsoTop + 12, 5, 8);
    ctx.fillRect(bx + 11.5, torsoTop + 12, 5, 8);

    // IMPORTANT FIX: Only draw the personal wooden desk front panel when ACTUALLY at their own desk!
    if (atOwnDesk) {
      const panelW = bot.deskW;
      const panelY = by + 13;
      ctx.fillStyle = 'rgba(0, 0, 0, 0.34)';
      ctx.fillRect(bx - panelW / 2 + 3, panelY + 10, panelW - 6, 4.5);
      ctx.fillStyle = leather ? '#4a2413' : '#5b3a22';
      ctx.fillRect(bx - panelW / 2, panelY, panelW, 11);
      ctx.fillStyle = leather ? '#6e3418' : '#8a5a33';
      ctx.fillRect(bx - panelW / 2, panelY, panelW, 4);
      ctx.fillStyle = '#c59262';
      ctx.fillRect(bx - panelW / 2, panelY, panelW, 1.5);

      // Hands typing on keyboard
      ctx.fillStyle = '#fbcfe8';
      ctx.fillRect(bx - 13, panelY - 2 + tA, 7, 4);
      ctx.fillRect(bx + 6, panelY - 2 + tB, 7, 4);

      // Salem's signature coffee mug on desk front
      if (bot.id === 'salem') {
        ctx.fillStyle = '#ffffff'; ctx.fillRect(bx + 24, panelY - 5, 6, 6);
        ctx.fillStyle = '#78350f'; ctx.fillRect(bx + 25, panelY - 4, 4, 2);
      }
    } else {
      // Seated in meeting room — hands resting cleanly
      ctx.fillStyle = '#fbcfe8';
      ctx.fillRect(bx - 15, torsoTop + 18, 5, 4);
      ctx.fillRect(bx + 10, torsoTop + 18, 5, 4);
    }
  } else {
    // Standing / Walking Employee
    let bob = 0, legSwing = 0, armSwing = 0;
    if (bot.isMoving && !REDUCED_MOTION) {
      bob = Math.abs(Math.sin(time * 0.013)) * 2.6;
      legSwing = Math.sin(time * 0.017) * 4.2;
      armSwing = Math.sin(time * 0.017) * 3.2;
    }
    const torsoTop = by - 8 - bob;
    headCenterY = torsoTop - headR - 1;

    // Legs & Shoes
    ctx.fillStyle = bot.pantsColor;
    ctx.fillRect(bx - 8, torsoTop + 20, 6, 11 + legSwing);
    ctx.fillRect(bx + 2, torsoTop + 20, 6, 11 - legSwing);
    ctx.fillStyle = '#0f172a';
    ctx.fillRect(bx - 9, torsoTop + 30 + legSwing, 8, 3);
    ctx.fillRect(bx + 1, torsoTop + 30 - legSwing, 8, 3);

    // Torso
    ctx.fillStyle = bot.shirtColor;
    ctx.beginPath(); ctx.arc(bx, torsoTop, 13, Math.PI, 0); ctx.fill();
    ctx.fillRect(bx - 13, torsoTop, 26, 21);
    ctx.fillStyle = bot.accentColor;
    ctx.fillRect(bx - 4, torsoTop + 3, 8, 3);
    drawOutfitDetails(bot, bx, torsoTop); // V4

    // Swinging arms
    ctx.fillStyle = bot.shirtColor;
    ctx.fillRect(bx - 17, torsoTop + 2 - armSwing, 5, 13);
    ctx.fillRect(bx + 12, torsoTop + 2 + armSwing, 5, 13);
    ctx.fillStyle = '#fbcfe8';
    ctx.fillRect(bx - 17, torsoTop + 14 - armSwing, 5, 4);
    ctx.fillRect(bx + 12, torsoTop + 14 + armSwing, 5, 4);

    // Signature walking props
    if (bot.id === 'salem' || (bot.onTrip && bot.tripKind === 'coffee' && bot.tripPhase !== 'go')) {
      ctx.fillStyle = '#ffffff'; ctx.fillRect(bx + 16, torsoTop + 8 + armSwing, 7, 7);
      ctx.fillStyle = '#78350f'; ctx.fillRect(bx + 17, torsoTop + 9 + armSwing, 5, 2);
      if (!REDUCED_MOTION) {
        ctx.fillStyle = 'rgba(255, 255, 255, 0.65)';
        const steamY = (time * 0.02) % 8;
        ctx.fillRect(bx + 19, torsoTop + 5 + armSwing - steamY, 2, 2);
      }
    } else if (bot.id === 'fazza') {
      ctx.fillStyle = '#e2e8f0'; ctx.fillRect(bx - 25, torsoTop + 7 - armSwing, 8, 11);
      ctx.fillStyle = '#94a3b8'; ctx.fillRect(bx - 23, torsoTop + 5 - armSwing, 4, 3);
      ctx.fillStyle = '#64748b';
      ctx.fillRect(bx - 24, torsoTop + 10 - armSwing, 6, 1.5);
      ctx.fillRect(bx - 24, torsoTop + 13 - armSwing, 6, 1.5);
    }
  }

  // Save head position for layered bubble pass
  bot._headX = bx;
  bot._headY = headCenterY;
  bot._headR = headR;

  // High-DPI Circular Avatar Head
  const img = avatarImages[bot.id];
  if (img && img.complete && img.naturalWidth > 0) {
    try {
      ctx.save();
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = 'high';
      ctx.beginPath();
      ctx.arc(bx, headCenterY, headR, 0, Math.PI * 2);
      ctx.clip();
      ctx.drawImage(img, bx - headR, headCenterY - headR, headR * 2, headR * 2);
      ctx.restore();
    } catch (e) {
      ctx.fillStyle = bot.shirtColor;
      ctx.beginPath(); ctx.arc(bx, headCenterY, headR, 0, Math.PI * 2); ctx.fill();
    }
  } else {
    ctx.fillStyle = bot.shirtColor;
    ctx.beginPath(); ctx.arc(bx, headCenterY, headR, 0, Math.PI * 2); ctx.fill();
  }

  // Status Ring
  let borderColor = '#38bdf8';
  if (bot.status === 'working') borderColor = '#10b981';
  if (bot.status === 'idle') borderColor = '#f59e0b';
  if (bot.status === 'stuck') borderColor = '#ef4444';
  if (bot.status === 'waiting') borderColor = '#38bdf8';
  if (bot.status === 'meeting') borderColor = '#c084fc';
  if (bot.isSleeping) borderColor = '#64748b';
  if (bot.id === 'elkebir') borderColor = '#fbbf24';

  ctx.strokeStyle = borderColor;
  ctx.lineWidth = 2.6;
  ctx.beginPath(); ctx.arc(bx, headCenterY, headR, 0, Math.PI * 2); ctx.stroke();

  // V4: headphones while working (deep in code)
  if (bot.feedStatus === 'working' && !bot.isSleeping) {
    ctx.strokeStyle = '#0f172a'; ctx.lineWidth = 2.4;
    ctx.beginPath(); ctx.arc(bx, headCenterY - 2, headR + 1.5, Math.PI * 1.05, Math.PI * 1.95); ctx.stroke();
    ctx.fillStyle = '#0f172a';
    ctx.fillRect(bx - headR - 3, headCenterY - 4, 5, 8);
    ctx.fillRect(bx + headR - 2, headCenterY - 4, 5, 8);
    ctx.fillStyle = '#22c55e';
    ctx.fillRect(bx - headR - 3, headCenterY - 1, 5, 2);
    ctx.fillRect(bx + headR - 2, headCenterY - 1, 5, 2);
  }

  // V4: floating emotes — read the team state at a glance
  if (!REDUCED_MOTION && !bot.isSleeping) {
    let emote = '';
    if (bot.feedStatus === 'stuck') emote = '💢';
    else if (bot.feedStatus === 'working' && bot.progress >= 80) emote = '🔥';
    else if (bot.ideaUntil && time < bot.ideaUntil) emote = '💡';
    if (emote) {
      const ey = headCenterY - headR - 22 + Math.sin(time * 0.004 + bx) * 2;
      ctx.font = '13px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(emote, bx + headR + 6, ey);
    }
    // V4: Hagras steams when stuck
    if (bot.id === 'hagras' && bot.feedStatus === 'stuck') {
      for (let pi = 0; pi < 3; pi++) {
        const pp = ((time * 0.001 + pi * 0.33) % 1);
        ctx.fillStyle = 'rgba(203, 213, 225, ' + (0.5 * (1 - pp)).toFixed(2) + ')';
        ctx.beginPath(); ctx.arc(bx + Math.sin(pi * 2.1) * 4, headCenterY - headR - 6 - pp * 12, 2.5 + pp * 2, 0, Math.PI * 2); ctx.fill();
      }
    }
  }

  // Breathing Ring for working / urgent pulse for stuck
  if ((bot.status === 'working' || bot.status === 'stuck') && !REDUCED_MOTION) {
    const pulse = (time % 1500) / 1500;
    const rgb = bot.status === 'stuck' ? '239, 68, 68' : '16, 185, 129';
    ctx.strokeStyle = 'rgba(' + rgb + ', ' + (0.5 * (1 - pulse)).toFixed(3) + ')';
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.arc(bx, headCenterY, headR + 2 + pulse * 6, 0, Math.PI * 2);
    ctx.stroke();
  }

  // Tiny badge icon on corner of head for stuck (!) or executive crown (👑)
  if (bot.status === 'stuck') {
    ctx.fillStyle = '#ef4444';
    ctx.beginPath(); ctx.arc(bx + headR - 2, headCenterY - headR + 2, 5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ffffff'; ctx.font = 'bold 7.5px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('!', bx + headR - 2, headCenterY - headR + 4.8);
  }

  // Sleeping Zzz particles
  if (bot.isSleeping) {
    for (let zi = 0; zi < 3; zi++) {
      const zPhase = ((time * 0.0016 + zi * 0.8) % 2.5);
      const zAlpha = Math.max(0, 1 - (zPhase / 2.5));
      const zx = bx + 9 + zPhase * 5;
      const zy = headCenterY - 8 - zPhase * 14;
      ctx.font = 'bold ' + (7 + zi * 2) + 'px sans-serif';
      ctx.fillStyle = 'rgba(147, 197, 253, ' + zAlpha.toFixed(2) + ')';
      ctx.fillText('Z', zx, zy);
    }
  }

  // Nameplate below employee (only when standing/walking or in meeting; desk already has brass nameplate!)
  if (!atOwnDesk) {
    const tagY = by + 35;
    const ns = STACKED_ON ? 1.5 : 1;
    ctx.font = '700 ' + (9.5 * ns) + 'px "IBM Plex Sans Arabic", Tahoma, sans-serif';
    const nameW = ctx.measureText(bot.name).width;
    ctx.fillStyle = 'rgba(11, 16, 27, 0.92)';
    ctx.fillRect(bx - nameW / 2 - 5 * ns, tagY - 9.5 * ns, nameW + 10 * ns, 14 * ns);
    ctx.strokeStyle = '#334155'; ctx.lineWidth = 1;
    ctx.strokeRect(bx - nameW / 2 - 5 * ns, tagY - 9.5 * ns, nameW + 10 * ns, 14 * ns);
    ctx.fillStyle = '#ffffff'; ctx.textAlign = 'center';
    ctx.fillText(bot.name, bx, tagY + 0.5 * ns);
  }

  ctx.restore();
}

// Separate Z-Pass for Bubbles: Compact pills normally (zero overlap!), Full speech bubbles on top!
function drawBotBubble(bot, time, expanded) {
  const hx = bot._headX, hy = bot._headY, r = bot._headR;
  if (hx === undefined) return;

  const celebrating = bot.bubbleUntil && time < bot.bubbleUntil;
  const chatting = bot.chatUntil && time < bot.chatUntil;

  let text;
  if (celebrating) {
    text = bot.bubbleText;
  } else if (chatting) {
    text = bot.chatText;
  } else if (bot.isSleeping) {
    text = '💤 نايم';
  } else if (bot.onTrip && bot.tripPhase === 'wait') {
    text = bot.tripKind === 'lounge' ? '🎮 استراحة سريعة' : '☕ قهوة مظبوط وراجع';
  } else if (expanded) {
    text = lastGoodFetchMs === null ? bot.title : (bot.shortTask || bot.statusLabel);
  } else {
    // Compact non-overlapping resting pill
    if (bot.status === 'meeting') text = '👥 اجتماع';
    else if (bot.status === 'stuck') text = '🔴 ' + bot.progress + '%';
    else if (bot.status === 'working') text = '🟢 ' + bot.progress + '%';
    else if (bot.status === 'waiting') text = '⏳ ' + bot.progress + '%';
    else text = '☕ متاح';
  }

  const bs = STACKED_ON ? 1.45 : 1;
  ctx.font = (expanded || celebrating || chatting ? '600 ' : '700 ') + (8.4 * bs) + 'px "IBM Plex Sans Arabic", Tahoma, sans-serif';
  ctx.textAlign = 'center';
  const tw = ctx.measureText(text).width;
  const bw = Math.max(tw + 14 * bs, (expanded ? 64 : 44) * bs);
  const bh = 16 * bs;

  const floatY = REDUCED_MOTION ? 0 : Math.sin(time * 0.0045 + hx * 0.1) * 1.6;
  const bubbleY = Math.max(4, hy - r - 18 * bs + floatY);

  let bg = 'rgba(11, 16, 27, 0.94)';
  let border = '#38bdf8';
  let textColor = '#f8fafc';

  if (bot.status === 'stuck') { bg = 'rgba(69, 10, 10, 0.95)'; border = '#ef4444'; textColor = '#fecaca'; }
  else if (bot.status === 'waiting') { bg = 'rgba(8, 30, 50, 0.95)'; border = '#38bdf8'; textColor = '#bae6fd'; }
  else if (bot.status === 'meeting') { bg = 'rgba(30, 20, 50, 0.96)'; border = '#c084fc'; textColor = '#f3e8ff'; }
  else if (bot.status === 'working') { border = '#10b981'; textColor = '#a7f3d0'; }
  else if (bot.status === 'idle') { border = '#f59e0b'; textColor = '#fef3c7'; }
  if (bot.isSleeping && !celebrating && !chatting) { bg = 'rgba(15, 23, 42, 0.95)'; border = '#64748b'; textColor = '#94a3b8'; }
  if (bot.id === 'elkebir' && !chatting && !celebrating) { border = '#fbbf24'; textColor = '#fef08a'; }
  if (chatting) { bg = 'rgba(8, 32, 52, 0.97)'; border = '#38bdf8'; textColor = '#e0f2fe'; }
  if (celebrating) { bg = 'rgba(48, 34, 6, 0.97)'; border = '#f2b33d'; textColor = '#fef08a'; }

  const bx0 = Math.max(4, Math.min(BASE_W - bw - 4, hx - bw / 2));
  const rad = 5 * bs;
  ctx.beginPath();
  ctx.moveTo(bx0 + rad, bubbleY);
  ctx.arcTo(bx0 + bw, bubbleY, bx0 + bw, bubbleY + bh, rad);
  ctx.arcTo(bx0 + bw, bubbleY + bh, bx0, bubbleY + bh, rad);
  ctx.arcTo(bx0, bubbleY + bh, bx0, bubbleY, rad);
  ctx.arcTo(bx0, bubbleY, bx0 + bw, bubbleY, rad);
  ctx.closePath();
  ctx.fillStyle = bg;
  ctx.fill();
  ctx.strokeStyle = border;
  ctx.lineWidth = 1.2;
  ctx.stroke();

  // Pointer triangle
  const tipX = Math.max(bx0 + 6, Math.min(bx0 + bw - 6, hx));
  ctx.fillStyle = bg;
  ctx.beginPath();
  ctx.moveTo(tipX - 3.5 * bs, bubbleY + bh - 0.5);
  ctx.lineTo(tipX + 3.5 * bs, bubbleY + bh - 0.5);
  ctx.lineTo(tipX, bubbleY + bh + 4 * bs);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = border;
  ctx.beginPath();
  ctx.moveTo(tipX - 3.5 * bs, bubbleY + bh);
  ctx.lineTo(tipX, bubbleY + bh + 4 * bs);
  ctx.lineTo(tipX + 3.5 * bs, bubbleY + bh);
  ctx.stroke();

  ctx.fillStyle = textColor;
  ctx.fillText(text, bx0 + bw / 2, bubbleY + 11.4 * bs);
}

function sendBotOnBreak(bot, kind) {
  if (!bot || teamMeetingActive || bot.status === 'stuck') return false;
  if (tripBot && tripBot !== bot) return false;
  if (interaction) endInteraction(performance.now());
  tripBot = bot;
  bot.isSleeping = false;
  bot.onTrip = true;
  bot.tripKind = kind || 'coffee';
  bot.tripPhase = 'go';
  bot.returningHome = false;

  const coffeeSpots = [{ x: 696, y: 446 }, { x: 768, y: 446 }, { x: 840, y: 446 }, { x: 826, y: 498 }];
  const loungeSpots = [{ x: 247, y: 458 }, { x: 168, y: 504 }];
  const spots = bot.tripKind === 'lounge' ? loungeSpots : coffeeSpots;
  const spot = spots[Math.floor(Math.random() * spots.length)];

  bot.tripTarget = spot;
  bot.tripWait = 0;
  setBotRoute(bot, spot.x, spot.y);
  bot.chatText = bot.tripKind === 'lounge' ? pickBanter('mood') : pickBanter('coffee');
  bot.chatUntil = performance.now() + 3400;
  addOfficeLog((bot.tripKind === 'lounge' ? '🎮 ' : '☕ ') + bot.name + ' طلع ياخد بريك سريع', 'coffee');

}

function updateCoffeeTrip(dt, time) {
  if (teamMeetingActive) return;

  if (tripBot) {
    const bot = tripBot;
    if (bot.tripPhase === 'wait') {
      bot.isMoving = false;
      bot.tripWait -= dt * 1000;
      if (bot.tripWait <= 0) {
        bot.tripPhase = 'back';
        setBotRoute(bot, bot.homeX, bot.homeY);
      }
      return;
    }
    const arrived = followRoute(bot, 68, dt);
    if (arrived) {
      if (bot.tripPhase === 'go') {
        bot.tripPhase = 'wait';
        bot.tripWait = 4200 + Math.random() * 2400;
        bot.chatText = bot.tripKind === 'lounge' ? '🎮 جيم سريع وأرجع!' : pickBanter('coffee');
        bot.chatUntil = time + 3200;
      } else {
        bot.onTrip = false;
        bot.tripPhase = '';
        bot.tripKind = '';
        tripBot = null;
        nextTripAt = time + 22000 + Math.random() * 24000;
      }
    }
    return;
  }

  if (interaction || time < nextTripAt) return;
  const candidates = BOT_KEYS.map(k => BOTS[k]).filter(b => b.id !== 'elkebir' && b.status !== 'stuck' && !b.onTrip && !b.returningHome && !b.isSleeping);
  if (!candidates.length) { nextTripAt = time + 8000; return; }
  const bot = candidates[Math.floor(Math.random() * candidates.length)];
  const kind = (bot.status === 'idle' && Math.random() < 0.4) ? 'lounge' : 'coffee';
  sendBotOnBreak(bot, kind);
}

let interaction = null;
let nextInteractionAt = 18000;

function clearChat(bot) { if (bot) { bot.chatUntil = 0; bot.chatText = ''; } }

function endInteraction(time) {
  if (interaction) {
    const parts = interaction.members
      ? interaction.members.map(m => m.bot)
      : [interaction.a, interaction.b, interaction.helper, interaction.helpee];
    parts.forEach(b => {
      if (!b) return;
      clearChat(b);
      if (b.onTrip && b !== tripBot) {
        b.onTrip = false;
        b.returningHome = true;
        setBotRoute(b, b.homeX, b.homeY);
      }
    });
  }
  interaction = null;
  nextInteractionAt = time + 18000 + Math.random() * 16000;
}

function freeDevBots() {
  return BOT_KEYS.map(k => BOTS[k]).filter(b => b.id !== 'elkebir' && !b.onTrip && !b.returningHome && !b.isSleeping);
}

function startChat(time) {

    ['hagras', 'nafady'], ['nafady', 'ashraf'], ['ashraf', 'salem'],
    ['marbouha', 'johnny'], ['johnny', 'fazza'], ['hagras', 'marbouha']
  ];

  if (!ok.length) return false;

  const a = BOTS[p[0]], b = BOTS[p[1]];

    ? [pickBanter('hallway'), b.feedStatus === 'working' ? pickBanter('busy') : pickBanter('mood')]

  return true;

function startStandup(time) {
  const pool = freeDevBots().filter(b => b.status !== 'stuck');
  if (pool.length < 3) return false;
  const shuffled = pool.slice().sort(() => Math.random() - 0.5);
  const group = shuffled.slice(0, 3);
  const spots = [{ x: 230, y: 84 }, { x: 185, y: 102 }, { x: 280, y: 102 }];

    bot.onTrip = true;

  });
  interaction = { type: 'standup', phase: 'go', members: members, presenter: members[0].bot, lineIdx: 0, nextLineAt: 0, until: 0 };

function startHelp(time) {
  const desk = freeDevBots();
  if (desk.length < 2) return false;
  const helpee = desk.find(b => b.status === 'stuck') || desk[Math.floor(Math.random() * desk.length)];
  const helpers = desk.filter(b => b !== helpee && b.status !== 'stuck');
  if (!helpers.length) return false;

  helper.onTrip = true;

function updateInteractions(dt, time) {
  if (teamMeetingActive) return;

  if (!interaction) {
    if (tripBot || time < nextInteractionAt) return;
    const starters = [startChat, startStandup, startHelp];
    const off = Math.floor(Math.random() * starters.length);
    for (let i = 0; i < starters.length; i++) {
      if (starters[(off + i) % starters.length](time)) return;
    }
    nextInteractionAt = time + 9000;
    return;
  }

  const it = interaction;

  if (it.type === 'chat') {
    if (time >= it.nextAt) {
      if (it.turn >= it.script.length) { endInteraction(time); return; }
      const speaker = it.turn % 2 === 0 ? it.a : it.b;
      clearChat(speaker === it.a ? it.b : it.a);
      speaker.chatText = it.script[it.turn];
      speaker.chatUntil = time + 2300;
      it.turn++;
      it.nextAt = time + 2450;
    }
    return;
  }

  if (it.type === 'standup') {
    if (it.phase === 'go') {
      let all = true;
      for (const m of it.members) if (!followRoute(m.bot, 68, dt)) all = false;
      if (all) { it.phase = 'stay'; it.until = time + 10000; it.lineIdx = 0; it.nextLineAt = time; }
    } else if (it.phase === 'stay') {
      if (time >= it.nextLineAt && it.lineIdx < MEETING_LINES.length) {
        it.presenter.chatText = MEETING_LINES[it.lineIdx];
        it.presenter.chatUntil = time + 2300;
        if (it.lineIdx % 2 === 1 && it.members.length > 1) {
          const other = it.members[1 + Math.floor(Math.random() * (it.members.length - 1))].bot;
          other.chatText = MEETING_REPLIES[Math.floor(Math.random() * MEETING_REPLIES.length)];
          other.chatUntil = time + 1800;
        }
        it.lineIdx++;
        it.nextLineAt = time + 2500;
      }
      if (time >= it.until) {
        it.phase = 'back';
        it.members.forEach(m => setBotRoute(m.bot, m.bot.homeX, m.bot.homeY));
      }
    } else {
      let all = true;
      for (const m of it.members) if (!followRoute(m.bot, 68, dt)) all = false;
      if (all) {
        it.members.forEach(m => { m.bot.onTrip = false; });
        endInteraction(time);
      }
    }
    return;
  }

  if (it.type === 'help') {
    if (it.phase === 'go') {
      if (followRoute(it.helper, 68, dt)) {
        it.phase = 'stay';
        it.until = time + 6500;
        it.helper.chatText = '🤝 بص، جرّب كده';
        it.helper.chatUntil = time + 3200;
      }
    } else if (it.phase === 'stay') {
      if (!it.replied && time > it.until - 3200) {
        it.replied = true;
        it.helpee.chatText = '💡 آه، فهمت! تسلم يا صاحبي';
        it.helpee.chatUntil = time + 2600;
      }
      if (time >= it.until) {
        it.phase = 'back';
        setBotRoute(it.helper, it.helper.homeX, it.helper.homeY);
      }
    } else {
      if (followRoute(it.helper, 68, dt)) {
        it.helper.onTrip = false;
        endInteraction(time);
      }
    }
  }
}

// ---------- Sleep & Wake-Up Mechanics ----------
const SLEEP_IDLE_THRESHOLD_MS = 30 * 60 * 1000;
const AWAKE_COOLDOWN_MS = 10 * 60 * 1000;

function checkBotSleep(bot, nowMs) {
  if (!bot) return false;
  if (bot.feedStatus !== 'idle' || bot.onTrip || bot.returningHome || teamMeetingActive) {
    bot.isSleeping = false;
    if (bot.feedStatus !== 'idle') bot.idleSince = null;
    return false;
  }
  const lastWoken = bot.lastWokenAt || -AWAKE_COOLDOWN_MS;
  if (performance.now() - lastWoken < AWAKE_COOLDOWN_MS) {
    bot.isSleeping = false;
    return false;
  }
  const updatedMs = bot.updatedAt ? Date.parse(bot.updatedAt) : NaN;
  const idleStart = Number.isFinite(updatedMs) ? updatedMs : (bot.idleSince || nowMs);
  if (!bot.idleSince) bot.idleSince = idleStart;

  if (nowMs - idleStart >= SLEEP_IDLE_THRESHOLD_MS) {
    bot.isSleeping = true;
    return true;
  }
  bot.isSleeping = false;
  return false;
}

function wakeUpBot(bot) {
  if (!bot) return;
  bot.isSleeping = false;
  bot.lastWokenAt = performance.now();
  bot.wakeAnimStart = performance.now();
  playWakeSound();
  const apology = WAKE_APOLOGIES[Math.floor(Math.random() * WAKE_APOLOGIES.length)];
  celebrateBot(bot, apology);
  addOfficeLog('⏰ صحّيت ' + bot.name + ': «' + apology + '»', 'info');
}

function updateBotSleep() {
  const nowMs = Date.now();
  for (const k of BOT_KEYS) checkBotSleep(BOTS[k], nowMs);
}
