<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="dark" />
<meta name="robots" content="noindex, nofollow" />
<link rel="icon" href="data:," />
<title>مكتب ديجر</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #070b13;
    --panel: #0e1624;
    --panel-2: #0a111e;
    --line: #22314e;
    --line-soft: #182540;
    --text: #eef3f9;
    --muted: #9db1c7;
    --faint: #647d99;
    --sky: #38bdf8;
    --green: #22c55e;
    --green-soft: #a7f3d0;
    --amber: #f5a623;
    --amber-soft: #fde9c8;
    --red: #f4534e;
    --red-soft: #fecaca;
    --gold: #f2b33d;
    /* Fluid growth: 0 on phones, grows on laptops, large on TVs */
    --growth: clamp(0px, (100vmin - 720px) * 0.045, 16px);
    --radius: 14px;
  }

  * { box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100vh;
    height: 100dvh;
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  body {
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background:
      radial-gradient(1100px 480px at 85% -10%, rgba(56, 189, 248, 0.07), transparent 60%),
      radial-gradient(900px 420px at 8% 110%, rgba(242, 179, 61, 0.05), transparent 60%),
      var(--bg);
  }

  button { font-family: inherit; cursor: pointer; }
  button:focus-visible { outline: 2px solid var(--sky); outline-offset: 2px; }


  /* ---------- Office-only stage: the scene IS the page ---------- */
  body { display: block; overflow: hidden; background: var(--bg); }

  .stage-space {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    height: 100dvh;
  }

  .canvas-stage {
    position: absolute;
    inset: 0;
    overflow: hidden;
    background: #0b1220;
  }

  canvas#office-canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }

  /* Room labels float over the scene itself (constant readable size) */
  .room-tags { position: absolute; inset: 0; z-index: 12; pointer-events: none; }
  .room-tag {
    position: absolute;
    padding: 5px 12px;
    border-radius: 999px;
    background: rgba(7, 11, 19, 0.82);
    border: 1px solid;
    font-size: clamp(10px, 1.6vmin, 20px);
    font-weight: 700;
    max-width: 47%;
    white-space: normal;
    line-height: 1.4;
    overflow-wrap: anywhere;
    text-align: center;
  }
  .room-tag .tag-short { display: none; }
  .room-tag.tag-tr { top: 9.5%; right: 12px; }
  .room-tag.tag-tl { top: 9.5%; left: 12px; }
  .room-tag.tag-br { bottom: 10px; right: 12px; }
  .room-tag.tag-bl { bottom: 10px; left: 12px; }

  @media (max-width: 640px) {
    .room-tag { max-width: 47%; padding: 4px 9px; font-size: 11px; }
    .room-tag .tag-full { display: none; }
    .room-tag .tag-short { display: inline; }
    .room-tag.tag-tr { right: 8px; }
    .room-tag.tag-tl { left: 8px; }
    .room-tag.tag-br { right: 8px; bottom: 8px; }
    .room-tag.tag-bl { left: 8px; bottom: 8px; }
  }

  /* Portrait phones: stacked rooms — each room full width, page scrolls */
  @media (max-width: 640px) and (orientation: portrait) {
    html, body { height: auto; }
    body { overflow-y: auto; overflow-x: hidden; }
    .stage-space { position: static; width: 100%; height: auto; }
    .canvas-stage { position: relative; height: auto; overflow: visible; }
    canvas#office-canvas { position: static; width: 100%; height: auto; }
    .room-tags { display: none; }
  }

  .agent-popup-card {
    position: absolute;
    width: 230px;
    background: rgba(15, 23, 42, 0.95);
    border: 1px solid rgba(148, 163, 184, 0.25);
    border-radius: 8px;
    box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
    backdrop-filter: blur(8px);
    padding: 12px 14px;
    z-index: 100;
    color: #f8fafc;
    font-family: 'IBM Plex Sans Arabic', Tahoma, sans-serif;
    direction: rtl;
    text-align: right;
    box-sizing: border-box;
    pointer-events: auto;
  }
  .agent-popup-card button:hover {
    filter: brightness(1.1);
  }
</style></style>

  </main>

const canvas = document.getElementById('office-canvas');

const BASE_W = 800;
const BASE_H = 540;
const REDUCED_MOTION = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

// High-DPI Resolution Scaler (Capped at DPR 2)
function setupCanvasDPR() {
  const rect = canvas.getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const targetW = Math.max(320, Math.round((rect.width || BASE_W) * dpr));
  const targetH = Math.max(216, Math.round((rect.height || BASE_H) * dpr));
  if (canvas.width !== targetW || canvas.height !== targetH) {
    canvas.width = targetW;
    canvas.height = targetH;
  }
}

// ---------- Camera (cinematic open + parallax) ----------
// Cinematic open: the camera starts zoomed in and eases out to the full
// office over the first seconds; any user camera action cancels the intro.
const camLayer = document.getElementById('camera-layer');
const cam = { x: 415, y: 200, zoom: 1.3, tx: 400, ty: 270, tzoom: 1 };
let introUntil = performance.now() + 4500;
// Light mouse parallax in the full view: the effective camera is the real
// camera plus a small eased offset, used consistently by the canvas, the
// hotspot layer and the pointer hit-testing.
const par = { x: 0, y: 0, tx: 0, ty: 0 };
let effCamX = 400;
let effCamY = 246;
let camRoom = null;
const ROOMS = {
  full:    { name: 'full',    x: 400, y: 270, zoom: 1 },
  manager: { name: 'manager', x: 655, y: 185, zoom: 2.1 },
  dev:     { name: 'dev',     x: 258, y: 190, zoom: 1.8 },
  coffee:  { name: 'coffee',  x: 645, y: 425, zoom: 2.0 },
  lounge:  { name: 'lounge',  x: 248, y: 425, zoom: 1.9 }
};

function setCamTarget(x, y, zoom, roomName) {
  zoom = Math.max(1, Math.min(2.6, zoom || 1));
  const hw = BASE_W / 2 / zoom;
  const hh = BASE_H / 2 / zoom;
  cam.tx = Math.max(hw, Math.min(BASE_W - hw, x));
  cam.ty = Math.max(hh, Math.min(BASE_H - hh, y));
  cam.tzoom = zoom;
  camRoom = roomName || null;
}

function updateCamera(dt) {
  if (REDUCED_MOTION) { cam.x = cam.tx; cam.y = cam.ty; cam.zoom = cam.tzoom; return; }
  const rate = performance.now() < introUntil ? 0.85 : 3.2;
  const f = 1 - Math.exp(-dt * rate);
  cam.x += (cam.tx - cam.x) * f;
  cam.y += (cam.ty - cam.y) * f;
  cam.zoom += (cam.tzoom - cam.zoom) * f;
}

function syncCameraLayer() {
  if (!camLayer) return;
  const rect = canvas.getBoundingClientRect();
  const k = rect.width / BASE_W;
  const kh = rect.height / BASE_H;
  const tx = rect.width / 2 - effCamX * k * cam.zoom;
  const ty = rect.height / 2 - effCamY * kh * cam.zoom;
  camLayer.style.transform = 'translate(' + tx.toFixed(1) + 'px, ' + ty.toFixed(1) + 'px) scale(' + cam.zoom.toFixed(3) + ')';
}

function roomAt(x, y) {
  if (y < 315) return x >= 505 ? ROOMS.manager : ROOMS.dev;

}

      size: 1.6 + Math.random() * 1.6, color: 'rgba(240, 245, 255, 0.55)',
      life: 1, decay: 0.02
    });
  }
  if (Math.random() < 0.3) {
    particles.push({
      x: 580 + (Math.random() * 8 - 4), y: 338,
      vx: (Math.random() - 0.5) * 0.4, vy: -0.6 - Math.random() * 0.5,
      size: 2 + Math.random() * 2, color: 'rgba(240, 245, 255, 0.65)',
      life: 1, decay: 0.015
    });
  }
  if (Math.random() < 0.15) {
    particles.push({
      x: 480 + (Math.random() * 8 - 4), y: 75,
      vx: 0, vy: -0.5, size: 1.5, color: 'rgba(255, 255, 255, 0.7)',
      life: 1, decay: 0.03
    });
  }
}

function updateParticles() {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.life -= p.decay;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

function drawParticles() {
  for (const p of particles) {
    ctx.fillStyle = p.color;
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillRect(Math.floor(p.x), Math.floor(p.y), p.size, p.size);
  }
  ctx.globalAlpha = 1.0;
}

// ---------- Procedural pixel-art drawing (same office, same layout) ----------

// 1. Parquet Hardwood Floor (Bullpen)
function drawParquetFloor(x, y, w, h) {
  const tileSize = 32;
  const plankH = 8;
  const colors = ['#b28a5f', '#a87f56', '#9c744c', '#b89368', '#997048'];
  for (let py = y; py < y + h; py += plankH) {
    const rowIndex = Math.floor(py / plankH);
    for (let px = x; px < x + w; px += tileSize) {
      const offset = (rowIndex % 2 === 0) ? 0 : 16;
      const actualX = px - offset;
      const colIndex = Math.floor(actualX / tileSize);
      const c = colors[Math.abs((rowIndex * 3 + colIndex * 7) % colors.length)];
      const drawX = Math.max(x, actualX);
      const drawW = Math.min(x + w - drawX, tileSize - (drawX - actualX));
      if (drawW > 0) {
        ctx.fillStyle = c;
        ctx.fillRect(drawX, py, drawW, plankH);
        ctx.fillStyle = 'rgba(70, 40, 20, 0.18)';
        ctx.fillRect(drawX, py + plankH - 1, drawW, 1);
        ctx.fillRect(drawX + drawW - 1, py, 1, plankH);
      }
    }
  }
}

// 2. Executive Mahogany Floor & Persian Rug (El Kebir's Room)
function drawExecutiveFloor(x, y, w, h) {
  const plankH = 10;
  const woodColors = ['#452214', '#3d1c10', '#4e2918', '#38180c'];
  for (let py = y; py < y + h; py += plankH) {
    const r = Math.floor(py / plankH);
    ctx.fillStyle = woodColors[r % woodColors.length];
    ctx.fillRect(x, py, w, plankH);
    ctx.fillStyle = 'rgba(0, 0, 0, 0.35)';
    ctx.fillRect(x, py + plankH - 1, w, 1);
  }

  const rugX = x + 30;
  const rugY = y + 35;
  const rugW = w - 60;
  const rugH = h - 60;

  ctx.fillStyle = '#fef08a';
  for (let fx = rugX; fx < rugX + rugW; fx += 4) {
    ctx.fillRect(fx, rugY - 3, 2, 3);
    ctx.fillRect(fx, rugY + rugH, 2, 3);
  }

  ctx.fillStyle = '#701a35';
  ctx.fillRect(rugX, rugY, rugW, rugH);

  ctx.strokeStyle = '#eab308';
  ctx.lineWidth = 4;
  ctx.strokeRect(rugX + 4, rugY + 4, rugW - 8, rugH - 8);

  ctx.strokeStyle = '#1e3a8a';
  ctx.lineWidth = 2;
  ctx.strokeRect(rugX + 9, rugY + 9, rugW - 18, rugH - 18);

  ctx.fillStyle = '#991b1b';
  for (let rx = rugX + 16; rx < rugX + rugW - 16; rx += 20) {
    for (let ry = rugY + 16; ry < rugY + rugH - 16; ry += 20) {
      ctx.fillRect(rx, ry, 6, 6);
      ctx.fillStyle = '#fbbf24';
      ctx.fillRect(rx + 2, ry + 2, 2, 2);
      ctx.fillStyle = '#991b1b';
    }
  }

  const cx = rugX + rugW / 2;
  const cy = rugY + rugH / 2;
  ctx.fillStyle = '#1e3a8a';
  ctx.beginPath();
  ctx.moveTo(cx, cy - 28);
  ctx.lineTo(cx + 45, cy);
  ctx.lineTo(cx, cy + 28);
  ctx.lineTo(cx - 45, cy);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = '#facc15';
  ctx.lineWidth = 2;
  ctx.stroke();

  ctx.fillStyle = '#f59e0b';
  ctx.fillRect(cx - 10, cy - 10, 20, 20);
  ctx.fillStyle = '#dc2626';
  ctx.fillRect(cx - 5, cy - 5, 10, 10);
  ctx.fillStyle = '#fef08a';
  ctx.fillRect(cx - 2, cy - 2, 4, 4);
}

// 3. Cafe Checkered Tiles (Coffee Corner)
function drawCheckeredFloor(x, y, w, h) {
  const size = 18;
  const tileA = '#7c4034';
  const tileB = '#d9cfb8';
  for (let py = y; py < y + h; py += size) {
    for (let px = x; px < x + w; px += size) {
      const isEven = (Math.floor(px / size) + Math.floor(py / size)) % 2 === 0;
      ctx.fillStyle = isEven ? tileA : tileB;
      const tw = Math.min(size, x + w - px);
      const th = Math.min(size, y + h - py);
      ctx.fillRect(px, py, tw, th);
      ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
      ctx.fillRect(px, py + th - 1, tw, 1);
      ctx.fillRect(px + tw - 1, py, 1, th);
    }
  }
}

function drawLoungeFloor(x, y, w, h) {
  ctx.fillStyle = PAL.lounge;

  ctx.fillStyle = 'rgba(20, 184, 166, 0.08)';
  for (let d = -h; d < w; d += 16) {

    ctx.lineTo(x + d + 8, y);
    ctx.lineTo(x + d + 8 + h, y + h);
    ctx.lineTo(x + d + h, y + h);

  }

  const rx = x + 30;
  const ry = y + 25;
  const rw = w - 60;
  const rh = h - 45;
  ctx.fillStyle = PAL.loungeRug;
  ctx.fillRect(rx, ry, rw, rh);
  ctx.strokeStyle = PAL.loungeLine;

  ctx.fillRect(rx + 8, ry + 8, 3, bs);
  ctx.fillRect(rx + rw - 8 - bs, ry + 8, bs, 3);

// Clean and format sprint board task titles
function cleanBoardTaskTitle(b) {
  if (!b) return '';
  let raw = b.task_title || b.taskTitle || '';
  if (!raw && b.task && !b.task.includes('بدون تحديث') && b.task !== 'مهمة قيد التنفيذ' && b.task !== 'في انتظار البث المباشر...') {
    raw = b.task;
  }
  if (!raw) {
    raw = b.taskId || b.task || b.shortTask || '';
  }
  return String(raw)
    .replace(/\s*🔴\s*متأخر/gu, '')
    .replace(/\s*متأخر/gu, '')
    .replace(/\s*بدون تحديث.*/gu, '')
    .replace(/\s+\d+%$/gu, '')
    .trim();
}

function fitBoardTitle(ctx, name, rawTitle, availWidth) {
  const prefix = name ? name + ': ' : '';
  const full = prefix + rawTitle;
  if (ctx.measureText(full).width <= availWidth) {
    return full;
  }
  let cut = rawTitle;
  while (cut.length > 0 && ctx.measureText(prefix + cut + '…').width > availWidth) {
    cut = cut.slice(0, -1);
  }
  if (cut.length === 0 && ctx.measureText(prefix + '…').width > availWidth) {
    let pCut = prefix;
    while (pCut.length > 0 && ctx.measureText(pCut + '…').width > availWidth) {
      pCut = pCut.slice(0, -1);
    }
    return pCut ? pCut + '…' : '…';
  }
  return prefix + cut + '…';
}

if (typeof window !== 'undefined') {
  window.cleanBoardTaskTitle = cleanBoardTaskTitle;
  window.fitBoardTitle = fitBoardTitle;
}

      const slot = slots[idx];

      ctx.fillStyle = b.status === 'stuck' ? '#ef4444' : '#10b981';

  // Glass Partition between El Kebir's Office & Bullpen

// ---------- «اليوم» wall board: today's numbers from the live feed only ----------
// Filled by computeTodayStats() on every feed apply; before the first feed it
// honestly says it is waiting for the broadcast — nothing here is invented.
let todayStats = { loaded: false, done: 0, openPrs: 0, mergedPrs: null, hasMergedData: false, events: [] };

function drawTodayBoard() {
  const bx = 498;
  const by = 7;
  const bw = 208;
  const bh = 36;

  ctx.fillStyle = '#8a6d2f';
  ctx.fillRect(bx - 2, by - 2, bw + 4, bh + 4);
  ctx.fillStyle = '#0c1a2e';
  ctx.fillRect(bx, by, bw, bh);

  ctx.font = 'bold 9px "IBM Plex Sans Arabic", Tahoma, sans-serif';
  ctx.textAlign = 'right';
  ctx.fillStyle = '#ffd97a';
  ctx.fillText('📌 لوحة اليوم', bx + bw - 6, by + 10);

  ctx.font = '7.5px "IBM Plex Sans Arabic", Tahoma, sans-serif';
  ctx.textAlign = 'left';
  ctx.fillStyle = '#9db1c7';
  ctx.fillText(new Date().toLocaleDateString('ar-EG', { day: 'numeric', month: 'short' }), bx + 6, by + 10);

  ctx.fillStyle = '#22314e';
  ctx.fillRect(bx + 4, by + 13, bw - 8, 1);

  if (!todayStats.loaded) {
    ctx.font = 'bold 8px "IBM Plex Sans Arabic", Tahoma, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillStyle = '#647d99';
    ctx.fillText('بانتظار البث المباشر…', bx + bw / 2, by + 26);
    return;
  }

  ctx.font = 'bold 8px "IBM Plex Sans Arabic", Tahoma, sans-serif';
  ctx.textAlign = 'right';
  ctx.fillStyle = '#a7f3d0';
  ctx.fillText('✅ إنجازات اليوم: ' + todayStats.done, bx + bw - 6, by + 22);
  ctx.textAlign = 'left';
  if (todayStats.hasMergedData) {
    ctx.fillStyle = '#7dd3fc';
    ctx.fillText('🔀 PRs اتدمجت: ' + todayStats.mergedPrs, bx + 6, by + 22);
  } else {
    // The live feed carries no merged-PR data at all (verified: no
    // merged_prs / closed_prs field), so the board must not pass the
    // open-PR count off as merged — it says honestly that there is
    // no merge data in the broadcast.
    ctx.fillStyle = '#647d99';
    ctx.fillText('🔀 PRs اتدمجت: لا بيانات', bx + 6, by + 22);
  }

  // Day timeline: one dot per bot whose feed update landed today,
  // positioned by its real updated_at time, colored by its real status.
  const lineY = by + 31;
  const x0 = bx + 10;
  const x1 = bx + bw - 10;
  ctx.fillStyle = '#334155';
  ctx.fillRect(x0, lineY, x1 - x0, 1);
  if (todayStats.events.length === 0) {
    ctx.font = '7px "IBM Plex Sans Arabic", Tahoma, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillStyle = '#647d99';
    ctx.fillText('لا نشاط مسجل اليوم بعد', bx + bw / 2, lineY - 2);
    return;
  }
  const now = new Date();
  const dayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
  for (const ev of todayStats.events) {
    const frac = Math.max(0, Math.min(1, (ev.t - dayStart) / 86400000));
    ctx.fillStyle = ev.status === 'stuck' ? '#ef4444' : ev.status === 'working' ? '#22c55e' : '#f59e0b';
    ctx.beginPath();
    ctx.arc(x0 + frac * (x1 - x0), lineY + 0.5, 1.9, 0, Math.PI * 2);
    ctx.fill();
  }
}

// Soft, wide contact shadow (radial gradient squashed into an ellipse) —
// grounds desks, chairs and employees without touching the avatars.
function softContactShadow(cx, cy, rx, ry, alpha) {
  const g = ctx.createRadialGradient(cx, cy, 1, cx, cy, rx);
  g.addColorStop(0, 'rgba(0, 0, 0, ' + alpha + ')');
  g.addColorStop(1, 'rgba(0, 0, 0, 0)');
  ctx.save();
  ctx.translate(cx, cy);
  ctx.scale(1, ry / rx);
  ctx.translate(-cx, -cy);
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(cx, cy, rx, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

  const w = ctx.measureText(name).width + 11 * ns;
  ctx.fillStyle = '#1e293b';
  ctx.fillRect(cx - w / 2, y, w, 8.5 * ns);
  ctx.strokeStyle = '#d4af37';
  ctx.lineWidth = 0.8;
  ctx.strokeRect(cx - w / 2, y, w, 8.5 * ns);
  ctx.fillStyle = '#fde68a';
  ctx.textAlign = 'center';
  ctx.fillText(name, cx, y + 6.8 * ns);
}

const CODE_SNIPPETS = {
  elkebir: ['plan: sprint board', 'assign(hagras, T-142)', 'review PR #231', 'sync: team standup', 'deploy → staging', 'approve: budget ok'],
  hagras: ['const res = await api()', 'if (ok) commit()', 'for (t of tasks) run(t)', 'return render(list)', 'await db.insert(row)', 'fix: null check'],
  nafady: ['interface Plan {', 'steps: [a, b, c]', 'risk: low', 'diagram.draw()', 'deps: none', 'estimate: 3d'],
  ashraf: ['expect(x).toBe(0)', 'grep -r TODO src/', 'assert(!leak)', 'bug #77 -> fixed', 'test edge cases', 'repro: steps 1-3'],
  marbouha: ['test: login pass', 'ci: pipeline #88', 'e2e: checkout pass', 'coverage: 92%', 'test: signup pass', 'report: all green'],
  johnny: ['SELECT * FROM pays', 'UPDATE invoices SET', 'WHERE id = $1', 'BEGIN; COMMIT;', 'JOIN users ON', 'index: idx_pay'],
  salem: ['git checkout -b fix', 'npm run build ok', 'git rebase main', 'push origin fix', 'resolve conflict', 'lint: clean'],
  fazza: ['audit: money gate', 'check P0 list', 'verify totals ok', 'flag: mismatch!', 'review SQL diff', 'sign-off: pending'],
  hazalqom: ['.card { r: 16px }', 'color: #f2b33d', 'font: Plex Arabic', 'gap: 12px', 'export -> figma', 'rtl: dir auto'],
  generic: ['const x = compute()', 'await run(task)', 'if (done) ship()', 'log: ok']
};

function updateBotCode(bot, dt) {
  if (!bot.code) bot.code = { lines: [], cur: '', li: 0, acc: 0 };
  if (bot.status === 'idle') { bot.code.acc = 0; return; }
  const pool = CODE_SNIPPETS[bot.id] || CODE_SNIPPETS.generic;
  const cps = bot.status === 'stuck' ? 1.1 : bot.charsPerSec;
  bot.code.acc += dt * cps;
  while (bot.code.acc >= 1) {
    bot.code.acc -= 1;
    const target = pool[bot.code.li % pool.length];
    if (bot.code.cur.length < target.length) {
      bot.code.cur += target.charAt(bot.code.cur.length);
    } else {
      bot.code.lines.push(bot.code.cur);
      if (bot.code.lines.length > 6) bot.code.lines.shift();
      bot.code.cur = '';
      bot.code.li++;
    }
  }
}

// Draws one monitor: variant 0 = typing code + progress strip, variant 1 = progress view.
// Stuck bots get a red screen; idle bots get a dark standby screen.
function drawBotScreen(bot, x, y, w, h, variant) {
  const st = bot ? bot.status : 'idle';
  if (st === 'stuck') ctx.fillStyle = '#2c0d10';
  else if (st === 'working') ctx.fillStyle = '#0a1526';
  else ctx.fillStyle = '#0b1120';
  ctx.fillRect(x, y, w, h);
  if (!bot) return;

  if (st === 'idle') {
    if (Math.floor(performance.now() / 900) % 2 === 0) {
      ctx.fillStyle = 'rgba(245, 166, 35, 0.55)';
      ctx.fillRect(x + w / 2 - 1, y + h / 2 - 1, 2, 2);
    }
    return;
  }

  const pct = Math.max(0, Math.min(100, bot.progress || 0));
  const barColor = st === 'stuck'
    ? (Math.floor(performance.now() / 500) % 2 === 0 ? '#f87171' : '#ef4444')
    : '#22c55e';

  if (variant === 1) {
    ctx.font = 'bold 6.5px monospace';
    ctx.textAlign = 'center';
    ctx.fillStyle = st === 'stuck' ? '#fca5a5' : '#a7f3d0';
    ctx.fillText(pct + '%', x + w / 2, y + 7);
    ctx.fillStyle = '#1e293b';
    ctx.fillRect(x + 2, y + h - 3.5, w - 4, 2);
    ctx.fillStyle = barColor;
    ctx.fillRect(x + 2, y + h - 3.5, (w - 4) * pct / 100, 2);
    ctx.textAlign = 'left';
    return;
  }

  const code = bot.code || { lines: [], cur: '' };
  const prev = code.lines.length ? code.lines[code.lines.length - 1] : '';
  ctx.font = '4.3px monospace';
  ctx.textAlign = 'left';
  ctx.fillStyle = st === 'stuck' ? 'rgba(252, 165, 165, 0.5)' : 'rgba(125, 211, 252, 0.5)';
  if (prev) ctx.fillText(prev, x + 1.5, y + 4, w - 3);
  ctx.fillStyle = st === 'stuck' ? '#fca5a5' : '#bae6fd';
  ctx.fillText(code.cur || '', x + 1.5, y + 8.5, w - 3);
  if (Math.floor(performance.now() / 450) % 2 === 0) {
    const tw = Math.min(ctx.measureText(code.cur || '').width, w - 5);
    ctx.fillStyle = st === 'stuck' ? '#ef4444' : '#38bdf8';
    ctx.fillRect(x + 2 + tw, y + 5.8, 1.6, 3);
  }
  ctx.fillStyle = 'rgba(30, 41, 59, 0.9)';
  ctx.fillRect(x, y + h - 2, w, 2);
  ctx.fillStyle = barColor;
  ctx.fillRect(x, y + h - 2, w * pct / 100, 2);
}

// 7. Floating Speech / Task Bubble above Bot Head
function drawBotBubble(bot, hx, hy, r, time) {
  const celebrating = bot.bubbleUntil && time < bot.bubbleUntil;
  const chatting = bot.chatUntil && time < bot.chatUntil;
  let text = bot.shortTask || bot.statusLabel;
  // Before the first feed there is no task to show: each bot's bubble
  // carries his own role/title instead of nine identical waiting bubbles.
  if (lastGoodFetchMs === null) text = bot.title;
  if (bot.onTrip && bot.tripPhase === 'wait') text = '☕ قهوة سريعة وراجع';
  if (chatting) text = bot.chatText;
  if (celebrating) text = bot.bubbleText;
  const bs = STACKED_ON ? 1.6 : 1;
  ctx.font = '600 ' + (8.5 * bs) + 'px "IBM Plex Sans Arabic", Tahoma, sans-serif';
  ctx.textAlign = 'center';
  const textMetrics = ctx.measureText(text);
  const bw = Math.max(textMetrics.width + 14 * bs, 56 * bs);
  const bh = 16 * bs;

  const floatY = REDUCED_MOTION ? 0 : Math.sin(time * 0.005 + hx) * 2;
  const bubbleY = hy - r - 15 * bs - (STACKED_ON ? 4 * bs : 0) + floatY;

  let bg = 'rgba(11, 16, 27, 0.95)';
  let border = '#38bdf8';
  let textColor = '#f8fafc';

  if (bot.status === 'stuck') {
    bg = 'rgba(69, 10, 10, 0.95)';
    border = '#ef4444';
    textColor = '#fecaca';
  } else if (bot.status === 'working') {
    border = '#10b981';
    textColor = '#a7f3d0';
  } else if (bot.status === 'idle') {
    border = '#f59e0b';
    textColor = '#fef3c7';
  }
  if (bot.id === 'elkebir') {
    border = '#fbbf24';
    textColor = '#fef08a';
  }
  if (chatting) {
    bg = 'rgba(8, 32, 52, 0.96)';
    border = '#38bdf8';
    textColor = '#e0f2fe';
  }
  if (celebrating) {
    bg = 'rgba(43, 32, 6, 0.96)';
    border = '#f2b33d';
    textColor = '#fef08a';
  }

  const bx0 = Math.max(2, Math.min(BASE_W - bw - 2, hx - bw / 2));
  ctx.fillStyle = bg;
  ctx.fillRect(bx0, bubbleY, bw, bh);
  ctx.strokeStyle = border;
  ctx.lineWidth = 1.2;
  ctx.strokeRect(bx0, bubbleY, bw, bh);

  ctx.fillStyle = bg;
  ctx.beginPath();
  ctx.moveTo(hx - 4 * bs, bubbleY + bh);
  ctx.lineTo(hx + 4 * bs, bubbleY + bh);
  ctx.lineTo(hx, bubbleY + bh + 4 * bs);
  ctx.closePath();
  ctx.fill();

  ctx.strokeStyle = border;
  ctx.beginPath();
  ctx.moveTo(hx - 4 * bs, bubbleY + bh);
  ctx.lineTo(hx, bubbleY + bh + 4 * bs);
  ctx.lineTo(hx + 4 * bs, bubbleY + bh);
  ctx.stroke();

  ctx.fillStyle = textColor;
  ctx.fillText(text, bx0 + bw / 2, bubbleY + 11.5 * bs);
}

// 8. Draw Bot Entity — an employee: seated at a workstation when on a task,
//    standing / walking around the office when free
function drawBotEntity(bot, time) {
  const isHovered = (hoveredBotId === bot.id);

  ctx.save();

  const bx = Math.floor(bot.x);
  const by = Math.floor(bot.y);

  // Desk bots always sit; roaming bots sit at their own desk while on a task.
  // A bot out on a coffee trip stands and walks instead.
  const seated = !bot.onTrip && (bot.isDesk || (bot.baseWander && !bot.wander));
  const headR = 13;
  let headCenterY;

  // Hover Spotlight Ring
  if (isHovered) {
    ctx.strokeStyle = '#38bdf8';
    ctx.lineWidth = 2;
    ctx.setLineDash([4, 4]);
    ctx.beginPath();
    ctx.ellipse(bx, by + 25, 27, 12, 0, 0, Math.PI * 2);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  // Shadow — soft and wide, grounding the employee and his chair
  softContactShadow(bx, by + 25, 21, 7.5, 0.42);

  if (seated) {
    // --- Office chair back behind the employee ---
    // The manager's chair is brown tufted leather; everyone else keeps the
    // standard office chair. (Furniture only — the employee is untouched.)
    const leather = bot.deskType === 'executive';
    ctx.fillStyle = leather ? '#241105' : '#0b1220';
    ctx.beginPath();
    ctx.arc(bx, by - 12, 17, Math.PI, 0);
    ctx.fill();
    ctx.fillRect(bx - 17, by - 12, 34, 26);
    ctx.fillStyle = leather ? '#5a3016' : '#22314e';
    ctx.beginPath();
    ctx.arc(bx, by - 12, 14, Math.PI, 0);
    ctx.fill();
    ctx.fillRect(bx - 14, by - 12, 28, 22);
    if (leather) {
      ctx.fillStyle = '#3a1e0c';
      ctx.fillRect(bx - 8, by - 9, 2.5, 2.5);
      ctx.fillRect(bx + 5.5, by - 9, 2.5, 2.5);
      ctx.fillRect(bx - 1.5, by - 4, 2.5, 2.5);
    }

    // Subtle working bob — each employee has his own rhythm
    const bob = (bot.status === 'working' && !REDUCED_MOTION) ? Math.sin(time * 0.005 * (bot.rhythm || 1) + bx) * 0.8 : 0;
    const torsoTop = by - 6 + bob;
    headCenterY = torsoTop - headR - 1;

    // Torso with shoulders
    ctx.fillStyle = bot.shirtColor;
    ctx.beginPath();
    ctx.arc(bx, torsoTop, 15, Math.PI, 0);
    ctx.fill();
    ctx.fillRect(bx - 15, torsoTop, 30, 23);
    ctx.fillStyle = bot.accentColor;
    ctx.fillRect(bx - 4, torsoTop + 4, 8, 3);

    // Arms reaching forward onto the desk — typing speed follows the bot's
    // own rhythm while working, and slows to a frustrated crawl when stuck
    const typing = (bot.status === 'working' || bot.status === 'stuck') && !REDUCED_MOTION;
    const typeSpd = bot.status === 'stuck' ? 0.008 : 0.03 * (bot.rhythm || 1);
    const typeAmp = bot.status === 'stuck' ? 0.6 : 1.4;
    const tA = typing ? Math.sin(time * typeSpd + bx) * typeAmp : 0;
    const tB = typing ? Math.cos(time * typeSpd * 0.9 + bx) * typeAmp : 0;
    ctx.fillStyle = bot.shirtColor;
    ctx.fillRect(bx - 19, torsoTop + 3, 5, 12);
    ctx.fillRect(bx + 14, torsoTop + 3, 5, 12);
    ctx.fillRect(bx - 17, torsoTop + 13, 5, 9);
    ctx.fillRect(bx + 12, torsoTop + 13, 5, 9);

    // Desk front panel over the lap — the employee sits BEHIND the desk
    const panelW = bot.deskType === 'executive' ? 118 : (bot.isDesk ? 76 : 72);
    const panelY = by + 15;
    ctx.fillStyle = 'rgba(0, 0, 0, 0.35)';
    ctx.fillRect(bx - panelW / 2 + 3, panelY + 10, panelW - 6, 5);
    ctx.fillStyle = leather ? '#4a2413' : '#5b3a22';
    ctx.fillRect(bx - panelW / 2, panelY, panelW, 11);
    ctx.fillStyle = leather ? '#6e3418' : '#8a5a33';
    ctx.fillRect(bx - panelW / 2, panelY, panelW, 4);
    ctx.fillStyle = '#c59262';
    ctx.fillRect(bx - panelW / 2, panelY, panelW, 1.5);

    // Hands resting on the keyboard, tapping while working
    ctx.fillStyle = '#fbcfe8';
    ctx.fillRect(bx - 13, panelY - 2 + tA, 7, 4);
    ctx.fillRect(bx + 6, panelY - 2 + tB, 7, 4);

    // Salem keeps his coffee on the desk
    if (bot.id === 'salem') {
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(bx + 24, panelY - 5, 6, 6);
      ctx.fillStyle = '#78350f';
      ctx.fillRect(bx + 25, panelY - 4, 4, 2);
    }
  } else {
    // --- Standing / walking employee ---
    let bob = 0;
    let legSwing = 0;
    let armSwing = 0;
    if (bot.isMoving && !REDUCED_MOTION) {
      bob = Math.abs(Math.sin(time * 0.012)) * 2.5;
      legSwing = Math.sin(time * 0.016) * 4;
      armSwing = Math.sin(time * 0.016) * 3;
    }
    const torsoTop = by - 8 - bob;
    headCenterY = torsoTop - headR - 1;

    // Legs & Shoes
    ctx.fillStyle = bot.pantsColor;
    ctx.fillRect(bx - 8, torsoTop + 20, 6, 11 + legSwing);
    ctx.fillRect(bx + 2, torsoTop + 20, 6, 11 - legSwing);
    ctx.fillStyle = '#0f172a';
    ctx.fillRect(bx - 9, torsoTop + 30 + legSwing, 8, 3);
    ctx.fillRect(bx + 1, torsoTop + 30 - legSwing, 8, 3);

    // Torso with shoulders
    ctx.fillStyle = bot.shirtColor;
    ctx.beginPath();
    ctx.arc(bx, torsoTop, 13, Math.PI, 0);
    ctx.fill();
    ctx.fillRect(bx - 13, torsoTop, 26, 21);
    ctx.fillStyle = bot.accentColor;
    ctx.fillRect(bx - 4, torsoTop + 3, 8, 3);

    // Arms at the sides, swinging while walking
    ctx.fillStyle = bot.shirtColor;
    ctx.fillRect(bx - 17, torsoTop + 2 - armSwing, 5, 13);
    ctx.fillRect(bx + 12, torsoTop + 2 + armSwing, 5, 13);
    ctx.fillStyle = '#fbcfe8';
    ctx.fillRect(bx - 17, torsoTop + 14 - armSwing, 5, 4);
    ctx.fillRect(bx + 12, torsoTop + 14 + armSwing, 5, 4);

    if (bot.id === 'salem') {
      // Coffee cup in hand
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(bx + 17, torsoTop + 8 + armSwing, 7, 7);
      ctx.fillStyle = '#78350f';
      ctx.fillRect(bx + 18, torsoTop + 9 + armSwing, 5, 2);
      if (!REDUCED_MOTION) {
        ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
        const steamY = (time * 0.02) % 8;
        ctx.fillRect(bx + 20, torsoTop + 5 + armSwing - steamY, 2, 2);
      }
    } else if (bot.id === 'fazza') {
      // Review clipboard in hand
      ctx.fillStyle = '#e2e8f0';
      ctx.fillRect(bx - 25, torsoTop + 7 - armSwing, 8, 11);
      ctx.fillStyle = '#94a3b8';
      ctx.fillRect(bx - 23, torsoTop + 5 - armSwing, 4, 3);
      ctx.fillStyle = '#64748b';
      ctx.fillRect(bx - 24, torsoTop + 10 - armSwing, 6, 1.5);
      ctx.fillRect(bx - 24, torsoTop + 13 - armSwing, 6, 1.5);
    }
  }

  // Head: Avatar Image rendered cleanly with High-DPI Smoothing
  const headCenterX = bx;

  const img = avatarImages[bot.id];
  if (img && img.complete && img.naturalWidth > 0) {
    try {
      ctx.save();
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = 'high';
      ctx.beginPath();
      ctx.arc(headCenterX, headCenterY, headR, 0, Math.PI * 2);
      ctx.clip();
      ctx.drawImage(img, headCenterX - headR, headCenterY - headR, headR * 2, headR * 2);
      ctx.restore();
    } catch (e) {
      ctx.fillStyle = bot.shirtColor;
      ctx.beginPath();
      ctx.arc(headCenterX, headCenterY, headR, 0, Math.PI * 2);
      ctx.fill();
    }
  } else {
    ctx.fillStyle = bot.shirtColor;
    ctx.beginPath();
    ctx.arc(headCenterX, headCenterY, headR, 0, Math.PI * 2);
    ctx.fill();
  }

  // Status ring around head
  let borderColor = '#38bdf8';
  if (bot.status === 'working') borderColor = '#10b981';
  if (bot.status === 'idle') borderColor = '#f59e0b';
  if (bot.status === 'stuck') borderColor = '#ef4444';
  if (bot.id === 'elkebir') borderColor = '#fbbf24';

  ctx.strokeStyle = borderColor;
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.arc(headCenterX, headCenterY, headR, 0, Math.PI * 2);
  ctx.stroke();

  // Working bots breathe: a soft pulse ring expanding off the status ring
  if (bot.status === 'working' && !REDUCED_MOTION) {
    const pulse = (time % 1600) / 1600;
    ctx.strokeStyle = 'rgba(16, 185, 129, ' + (0.45 * (1 - pulse)).toFixed(3) + ')';
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.arc(headCenterX, headCenterY, headR + 2 + pulse * 5, 0, Math.PI * 2);
    ctx.stroke();
  }

  // Floating Speech/Task Bubble
  drawBotBubble(bot, headCenterX, headCenterY, headR, time);

  // Arabic Nameplate Below Bot
  const tagY = by + 36;
  const ns = STACKED_ON ? 1.8 : 1;
  ctx.font = '700 ' + (10 * ns) + 'px "IBM Plex Sans Arabic", Tahoma, sans-serif';
  const nameW = ctx.measureText(bot.name).width;
  ctx.fillStyle = 'rgba(11, 16, 27, 0.95)';
  ctx.fillRect(bx - nameW / 2 - 5 * ns, tagY - 10 * ns, nameW + 10 * ns, 15 * ns);
  ctx.strokeStyle = '#334155';
  ctx.lineWidth = 1;
  ctx.strokeRect(bx - nameW / 2 - 5 * ns, tagY - 10 * ns, nameW + 10 * ns, 15 * ns);

  ctx.fillStyle = '#ffffff';
  ctx.textAlign = 'center';
  ctx.fillText(bot.name, bx, tagY + 1 * ns);

  ctx.restore();
}

// ---------- Coffee trips: every so often a desk employee gets up ----------
// walks to the coffee bar, waits a few seconds, then returns to his desk.
let tripBot = null;
let nextTripAt = 15000;

function updateCoffeeTrip(dt, time) {
  if (tripBot) {
    const bot = tripBot;
    if (bot.tripPhase === 'wait') {
      bot.isMoving = false;
      bot.tripWait -= dt * 1000;
      if (bot.tripWait <= 0) bot.tripPhase = 'back';
      return;
    }
    const target = bot.tripPhase === 'go' && bot.tripTarget ? bot.tripTarget : { x: bot.homeX, y: bot.homeY };
    const dx = target.x - bot.x;
    const dy = target.y - bot.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (dist < 3) {
      bot.isMoving = false;
      if (bot.tripPhase === 'go') {
        bot.tripPhase = 'wait';
        bot.tripWait = 3500 + Math.random() * 2000;
      } else {
        bot.onTrip = false;
        bot.tripPhase = '';
        tripBot = null;
        nextTripAt = time + 26000 + Math.random() * 30000;
      }
      return;
    }
    bot.isMoving = true;
    const speed = 58;
    bot.x += (dx / dist) * speed * dt;
    bot.y += (dy / dist) * speed * dt;
    return;
  }
  if (typeof feedInitialized === 'undefined' || !feedInitialized || interaction || time < nextTripAt) return;
  const candidates = BOT_KEYS.map(k => BOTS[k]).filter(b => b.isDesk && b.status !== 'stuck' && !b.onTrip);
  if (!candidates.length) { nextTripAt = time + 8000; return; }
  const bot = candidates[Math.floor(Math.random() * candidates.length)];
  tripBot = bot;
  bot.onTrip = true;
  bot.tripPhase = 'go';
  bot.tripTarget = { x: 636 + Math.random() * 36, y: 398 + Math.random() * 10 };
  bot.tripWait = 0;
}

// ---------- Employee interactions ----------
// Every so often the office acts out a small scene with the SAME employee
// figures (nothing about their appearance changes — they just move & talk):
//  • chat    — two desk neighbours talk, speech bubbles alternating
//  • meeting — a few employees gather around the sprint whiteboard
//  • help    — one employee walks over and helps another at his desk
// Scenes only run once the real feed is in, never overlap each other or a
// coffee trip, and the manager keeps his own room (he never crosses the
// glass partition), so participants are the five dev-desk employees.
const CHAT_SCRIPTS = [
  ['خلصت مراجعة الكود؟', 'أيوه، كله تمام ✅', 'تمام، ندمج دلوقتي؟', 'يلا بينا 👌'],
  ['الـ CI عدى على طول', 'جميل، نراجع سوا؟', 'تمام، دقيقتين وأخلص', 'خد وقتك'],
  ['في اجتماع سريع عند السبورة', 'تمام، أنا جاي', 'هات معاك الملاحظات', 'حاضر ✍️'],
  ['جرّبت الحل اللي قلتلك عليه؟', 'شغال تمام الحمد لله', 'كويس، كمّل كده', 'تسلم يا صاحبي']
];
const MEETING_LINES = ['📊 دي خطة السبرنت الحالية', 'نركز على المهام المعلقة الأول', 'مين محتاج مساعدة في حاجة؟', 'تمام، نكمل على كده'];
const MEETING_REPLIES = ['✍️ سجلتها', '👍 تمام', 'تمام معاك'];

let interaction = null;
let nextInteractionAt = 24000;

function stepToward(bot, tx, ty, speed, dt) {
  const dx = tx - bot.x;
  const dy = ty - bot.y;
  const dist = Math.sqrt(dx * dx + dy * dy);
  if (dist < 3) { bot.isMoving = false; return true; }
  bot.isMoving = true;
  bot.x += (dx / dist) * speed * dt;
  bot.y += (dy / dist) * speed * dt;
  return false;
}

function clearChat(bot) { if (bot) { bot.chatUntil = 0; bot.chatText = ''; } }

function endInteraction(time) {
  if (interaction) {
    const parts = interaction.members
      ? interaction.members.map(m => m.bot)
      : [interaction.a, interaction.b, interaction.helper, interaction.helpee];
    parts.forEach(clearChat);
  }
  interaction = null;
  nextInteractionAt = time + 20000 + Math.random() * 18000;
}

function freeDevBots() {
  return BOT_KEYS.map(k => BOTS[k]).filter(b => b.isDesk && b.id !== 'elkebir' && !b.onTrip);
}

function startChat(time) {
  const pairs = [['hagras', 'nafady'], ['nafady', 'ashraf'], ['marbouha', 'johnny'], ['hagras', 'marbouha'], ['ashraf', 'johnny']];
  const ok = pairs.filter(p => !BOTS[p[0]].onTrip && !BOTS[p[1]].onTrip);
  if (!ok.length) return false;
  const p = ok[Math.floor(Math.random() * ok.length)];
  interaction = {
    type: 'chat',
    a: BOTS[p[0]],
    b: BOTS[p[1]],
    script: CHAT_SCRIPTS[Math.floor(Math.random() * CHAT_SCRIPTS.length)],
    turn: 0,
    nextAt: time
  };
  return true;
}

function startMeeting(time) {
  const pool = freeDevBots().filter(b => b.status !== 'stuck');
  if (pool.length < 3) return false;
  const shuffled = pool.slice();
  for (let i = shuffled.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = shuffled[i]; shuffled[i] = shuffled[j]; shuffled[j] = t;
  }
  const group = shuffled.slice(0, 3 + Math.floor(Math.random() * 2));
  const spots = [{ x: 218, y: 82 }, { x: 160, y: 106 }, { x: 218, y: 112 }, { x: 276, y: 106 }, { x: 304, y: 84 }];
  const members = group.map((bot, i) => ({ bot: bot, spot: spots[i] }));
  members.forEach(m => { m.bot.onTrip = true; });
  interaction = { type: 'meeting', phase: 'go', members: members, presenter: members[0].bot, lineIdx: 0, nextLineAt: 0, until: 0 };
  return true;
}

function startHelp(time) {
  const desk = freeDevBots();
  if (desk.length < 2) return false;
  const helpee = desk.find(b => b.status === 'stuck') || desk[Math.floor(Math.random() * desk.length)];
  const helpers = desk.filter(b => b !== helpee && b.status !== 'stuck');
  if (!helpers.length) return false;
  const helper = helpers[Math.floor(Math.random() * helpers.length)];
  helper.onTrip = true;
  interaction = {
    type: 'help',
    phase: 'go',
    helper: helper,
    helpee: helpee,
    spot: { x: helpee.homeX + 44, y: helpee.homeY + 4 },
    until: 0,
    replied: false
  };
  return true;
}

function updateInteractions(dt, time) {
  if (!interaction) {
    if (!feedInitialized || tripBot || time < nextInteractionAt) return;
    const starters = [startChat, startMeeting, startHelp];
    const off = Math.floor(Math.random() * starters.length);
    for (let i = 0; i < starters.length; i++) {
      if (starters[(off + i) % starters.length](time)) return;
    }
    nextInteractionAt = time + 9000;
    return;
  }

  const it = interaction;

  if (it.type === 'chat') {
    if (time >= it.nextAt) {
      if (it.turn >= it.script.length) { endInteraction(time); return; }
      const speaker = it.turn % 2 === 0 ? it.a : it.b;
      clearChat(speaker === it.a ? it.b : it.a);
      speaker.chatText = it.script[it.turn];
      speaker.chatUntil = time + 1750;
      it.turn++;
      it.nextAt = time + 1850;
    }
    return;
  }

  if (it.type === 'meeting') {
    if (it.phase === 'go') {
      let all = true;
      for (const m of it.members) if (!stepToward(m.bot, m.spot.x, m.spot.y, 64, dt)) all = false;
      if (all) { it.phase = 'stay'; it.until = time + 10500; it.lineIdx = 0; it.nextLineAt = time; }
    } else if (it.phase === 'stay') {
      if (time >= it.nextLineAt && it.lineIdx < MEETING_LINES.length) {
        it.presenter.chatText = MEETING_LINES[it.lineIdx];
        it.presenter.chatUntil = time + 2300;
        if (it.lineIdx % 2 === 1 && it.members.length > 1) {
          const other = it.members[1 + Math.floor(Math.random() * (it.members.length - 1))].bot;
          other.chatText = MEETING_REPLIES[Math.floor(Math.random() * MEETING_REPLIES.length)];
          other.chatUntil = time + 1800;
        }
        it.lineIdx++;
        it.nextLineAt = time + 2500;
      }
      if (time >= it.until) it.phase = 'back';
    } else {
      let all = true;
      for (const m of it.members) if (!stepToward(m.bot, m.bot.homeX, m.bot.homeY, 64, dt)) all = false;
      if (all) {
        it.members.forEach(m => { m.bot.onTrip = false; });
        endInteraction(time);
      }
    }
    return;
  }

  if (it.type === 'help') {
    if (it.phase === 'go') {
      if (stepToward(it.helper, it.spot.x, it.spot.y, 62, dt)) {
        it.phase = 'stay';
        it.until = time + 6500;
        it.helper.chatText = '🤝 بص، جرّب كده';
        it.helper.chatUntil = time + 3200;
      }
    } else if (it.phase === 'stay') {
      if (!it.replied && time > it.until - 3200) {
        it.replied = true;
        it.helpee.chatText = '💡 آه، فهمت! تسلم';
        it.helpee.chatUntil = time + 2600;
      }
      if (time >= it.until) it.phase = 'back';
    } else {
      if (stepToward(it.helper, it.helper.homeX, it.helper.homeY, 62, dt)) {
        it.helper.onTrip = false;
        endInteraction(time);
      }
    }
  }
}

// ---------- Game Loop ----------

// ---------- Portrait stacked mode: rooms stacked vertically ----------
// On narrow portrait phones the single 800x540 scene shrinks to an unreadable
// strip, so each room is rendered as its own full-width strip, stacked top to
// bottom, and the page scrolls. Landscape (laptop / TV) is untouched.
const STACKED_STRIPS = [
  { key: 'dev',     x: 0,   y: 0,   w: 540, h: 315, label: '\uD83D\uDCBB \u0635\u0627\u0644\u0629 \u0627\u0644\u062A\u0637\u0648\u064A\u0631 \u0627\u0644\u0631\u0626\u064A\u0633\u064A\u0629', color: '#7dd3fc', border: 'rgba(56,189,248,.5)' },
  { key: 'manager', x: 490, y: 0,   w: 310, h: 315, label: '\uD83D\uDC51 \u063A\u0631\u0641\u0629 \u0627\u0644\u0645\u062F\u064A\u0631 \u00AB\u0627\u0644\u0643\u0628\u064A\u0631\u00BB', color: '#ffd97a', border: 'rgba(242,179,61,.55)' },
  { key: 'lounge',  x: 0,   y: 315, w: 490, h: 225, label: '\uD83D\uDECB\uFE0F \u0631\u0643\u0646 \u0627\u0644\u0627\u0633\u062A\u0631\u0627\u062D\u0629 \u0648\u0627\u0644\u0623\u0644\u0639\u0627\u0628', color: '#5eead4', border: 'rgba(45,212,191,.5)' },
  { key: 'coffee',  x: 490, y: 315, w: 310, h: 225, label: '\u2615 \u0631\u0643\u0646 \u0627\u0644\u0642\u0647\u0648\u0629 \u0648\u0627\u0644\u0645\u0637\u0628\u062E', color: '#fbbf24', border: 'rgba(245,166,35,.5)' }
];
const STACKED_BAND = 36; // px title band above each strip
const STACKED_GAP = 10;  // px gap between strips
let STACKED_ON = false;
let stackedLayout = null;
let stackedHeightCache = -1;

function stackedActive() {
  return window.matchMedia('(max-width: 640px) and (orientation: portrait)').matches;
}

function computeStackedLayout() {
  const w = canvas.clientWidth || window.innerWidth || 390;
  let top = 0;
  const strips = STACKED_STRIPS.map(function (r) {
    const s = w / r.w; // CSS px per base unit
    const h = STACKED_BAND + r.h * s;
    const strip = { key: r.key, x: r.x, y: r.y, w: r.w, h: r.h, label: r.label, color: r.color, border: r.border, top: top, hCss: h, s: s, roomTop: top + STACKED_BAND };
    top += h + STACKED_GAP;
    return strip;
  });
  return { totalH: top - STACKED_GAP, strips: strips };
}

function layoutCanvas() {
  if (stackedActive()) {
    STACKED_ON = true;
    const layout = computeStackedLayout();
    stackedLayout = layout;
    if (stackedHeightCache !== layout.totalH) {
      stackedHeightCache = layout.totalH;
      canvas.style.height = layout.totalH + 'px';
    }
  } else {
    if (STACKED_ON) { canvas.style.height = ''; stackedHeightCache = -1; stackedLayout = null; }
    STACKED_ON = false;
  }
}

function drawStripTitle(st, topPx, dpr) {
  const pad = 12 * dpr;
  const bandH = STACKED_BAND * dpr;
  const fontPx = 15 * dpr;
  const pillH = 24 * dpr;
  const pillY = topPx + (bandH - pillH) / 2;
  ctx.save();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.font = '700 ' + fontPx + 'px "IBM Plex Sans Arabic", Tahoma, sans-serif';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  const tw = ctx.measureText(st.label).width;
  const pillW = tw + 22 * dpr;
  const r = pillH / 2;
  ctx.beginPath();
  ctx.moveTo(pad + r, pillY);
  ctx.arcTo(pad + pillW, pillY, pad + pillW, pillY + pillH, r);
  ctx.arcTo(pad + pillW, pillY + pillH, pad, pillY + pillH, r);
  ctx.arcTo(pad, pillY + pillH, pad, pillY, r);
  ctx.arcTo(pad, pillY, pad + pillW, pillY, r);
  ctx.closePath();
  ctx.fillStyle = 'rgba(7, 11, 19, 0.88)';
  ctx.fill();
  ctx.strokeStyle = st.border;
  ctx.lineWidth = Math.max(1, dpr);
  ctx.stroke();
  ctx.fillStyle = st.color;
  ctx.fillText(st.label, pad + 11 * dpr, pillY + pillH / 2);
  ctx.restore();
}

function renderStacked(time) {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const layout = stackedLayout || computeStackedLayout();
  ctx.save();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#0b1220';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.imageSmoothingEnabled = false;
  for (const st of layout.strips) {
    const s = st.s * dpr;
    const topPx = st.top * dpr;
    const roomTopPx = st.roomTop * dpr;
    const roomHPx = (st.hCss - STACKED_BAND) * dpr;
    // Title band background
    ctx.fillStyle = '#0e1624';
    ctx.fillRect(0, topPx, canvas.width, STACKED_BAND * dpr);
    // Room viewport
    ctx.save();
    ctx.beginPath();
    ctx.rect(0, roomTopPx, canvas.width, roomHPx);
    ctx.clip();
    ctx.setTransform(s, 0, 0, s, -st.x * s, roomTopPx - st.y * s);
    ctx.clearRect(st.x, st.y, st.w, st.h);
    drawWorld(time, false);
    ctx.restore();
    // Title pill (device coordinates, fixed readable size)
    drawStripTitle(st, topPx, dpr);
  }
  ctx.restore();
}

function updateWorld(dt, time) {
  // 3. Update Wandering Bots
  for (const key of BOT_KEYS) {
    const bot = BOTS[key];
    if (bot.wander && bot.waypoints) {
      if (bot.currentWp === undefined) bot.currentWp = 0;
      if (!bot.waitTimer) bot.waitTimer = 0;

      const wp = bot.waypoints[bot.currentWp];
      const dx = wp.x - bot.x;
      const dy = wp.y - bot.y;
      const dist = Math.sqrt(dx * dx + dy * dy);

      if (dist < 2) {
        bot.isMoving = false;
        bot.waitTimer += dt * 1000;
        if (bot.waitTimer >= (wp.wait || 3000)) {
          bot.waitTimer = 0;
          bot.currentWp = (bot.currentWp + 1) % bot.waypoints.length;
        }
      } else {
        bot.isMoving = true;
        const speed = 25;
        bot.x += (dx / dist) * speed * dt;
        bot.y += (dy / dist) * speed * dt;
      }
    }
  }

  // 3b. Coffee trips, employee interactions, code typing
  updateCoffeeTrip(dt, time);
  updateInteractions(dt, time);
  for (const key of BOT_KEYS) updateBotCode(BOTS[key], dt);

  // 4. Particles (spawn + update; drawn in drawWorld)
  spawnParticles();
  updateParticles();
}

function drawWorld(time, withVignette) {
  // 1. Flooring per zone
  ctx.imageSmoothingEnabled = false;
  drawParquetFloor(0, 45, 510, 270);
  drawExecutiveFloor(510, 45, 290, 270);
  drawLoungeFloor(0, 315, 490, 225);
  drawCheckeredFloor(490, 315, 310, 225);

  // 2. Walls and Props
  drawWalls();
  drawOfficeFurniture(time);

  // 4. Particles
  drawParticles();

  // 5. Draw Bots sorted by Y
  const sortedBots = BOT_KEYS.map(k => BOTS[k]).sort((a, b) => a.y - b.y);
  for (const bot of sortedBots) {
    drawBotEntity(bot, time);
  }

  // 5b. Time-of-day lighting tint + vignette for depth
  if (PHASE.tint) {
    ctx.fillStyle = PHASE.tint;
    ctx.fillRect(-120, -120, BASE_W + 240, BASE_H + 240);
  }
  if (withVignette) {
    const vg = ctx.createRadialGradient(BASE_W / 2, BASE_H / 2, 250, BASE_W / 2, BASE_H / 2, 580);
    vg.addColorStop(0, 'rgba(0, 0, 0, 0)');
    vg.addColorStop(1, 'rgba(0, 0, 0, 0.30)');
    ctx.fillStyle = vg;
    ctx.fillRect(-120, -120, BASE_W + 240, BASE_H + 240);
  }
}

let lastFrameTime = performance.now();

function gameLoop(time) {
  const dt = Math.min((time - lastFrameTime) / 1000, 0.1);
  lastFrameTime = time;

  layoutCanvas();
  setupCanvasDPR();

  PHASE = phaseMode === 'day' ? DAY_PHASE : phaseMode === 'night' ? NIGHT_PHASE : getDayPhase();

  if (!STACKED_ON) {
    updateCamera(dt);

    // Ease the mouse parallax and fold it into the effective camera
    par.x += (par.tx - par.x) * (1 - Math.exp(-dt * 2.2));
    par.y += (par.ty - par.y) * (1 - Math.exp(-dt * 2.2));
    effCamX = cam.x + par.x / cam.zoom;
    effCamY = cam.y + par.y / cam.zoom;
  } else {
    par.tx = 0; par.ty = 0; par.x = 0; par.y = 0;
    effCamX = cam.x; effCamY = cam.y;
  }

  updateWorld(dt, time);

  if (STACKED_ON) {
    renderStacked(time);
  } else {
    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = '#0b1220';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    // Uniform fit: the whole 800x540 office always stays fully visible and
    // undistorted on any screen; spare viewport space is quiet surround.
    const su = Math.min(canvas.width / BASE_W, canvas.height / BASE_H);
    ctx.setTransform(su * cam.zoom, 0, 0, su * cam.zoom, canvas.width / 2 - effCamX * su * cam.zoom, canvas.height / 2 - effCamY * su * cam.zoom);
    ctx.clearRect(0, 0, BASE_W, BASE_H);
    drawWorld(time, true);
    ctx.restore();
  }

  // 6. Keep the camera layer in sync
  syncCameraLayer();

  requestAnimationFrame(gameLoop);
}

// ---------- Mouse parallax, hover glow & click card ----------
// Moving the mouse softly rings the bot under the cursor.
// Clicking a bot opens its status card with task, progress, and cheer action.
const stageEl = document.getElementById('stage-wrapper');

function findBotAtPointer(clientX, clientY) {
  if (!canvas) return null;
  const rect = canvas.getBoundingClientRect();
  if (STACKED_ON) {
    const layout = stackedLayout || computeStackedLayout();
    const cx = clientX - rect.left;
    const cy = clientY - rect.top;
    for (const st of layout.strips) {
      if (cy >= st.roomTop && cy <= st.top + st.hCss) {
        const wx = st.x + cx / st.s;
        const wy = st.y + (cy - st.roomTop) / st.s;
        for (const key of BOT_KEYS) {
          const bot = BOTS[key];
          const dx = wx - bot.x;
          const dy = wy - (bot.y - 6);
          if (Math.sqrt(dx * dx + dy * dy) < 28) return bot;
        }
      }
    }
    return null;
  }
  const suCss = Math.min(rect.width / BASE_W, rect.height / BASE_H);
  const wx = effCamX + ((clientX - rect.left) - rect.width / 2) / (suCss * cam.zoom);
  const wy = effCamY + ((clientY - rect.top) - rect.height / 2) / (suCss * cam.zoom);
  for (const key of BOT_KEYS) {
    const bot = BOTS[key];
    const dx = wx - bot.x;
    const dy = wy - (bot.y - 6);
    if (Math.sqrt(dx * dx + dy * dy) < 28) return bot;
  }
  return null;
}

function getBotScreenPos(bot) {
  if (!canvas) return { x: 0, y: 0 };
  const rect = canvas.getBoundingClientRect();
  if (STACKED_ON) {
    const layout = stackedLayout || computeStackedLayout();
    for (const st of layout.strips) {
      if (bot.x >= st.x && bot.x <= st.x + st.w && bot.y >= st.y && bot.y <= st.y + st.h) {
        const sx = rect.left + (bot.x - st.x) * st.s;
        const sy = rect.top + st.roomTop + (bot.y - 6 - st.y) * st.s;
        return { x: sx, y: sy };
      }
    }
  }
  const suCss = Math.min(rect.width / BASE_W, rect.height / BASE_H);
  const sx = rect.left + rect.width / 2 + (bot.x - effCamX) * (suCss * cam.zoom);
  const sy = rect.top + rect.height / 2 + (bot.y - 6 - effCamY) * (suCss * cam.zoom);
  return { x: sx, y: sy };
}

let selectedCardBotId = null;

function getOrCreateCard() {
  let card = document.getElementById('agent-card-popup');
  if (!card && typeof document !== 'undefined' && typeof document.createElement === 'function') {
    card = document.createElement('div');
    card.id = 'agent-card-popup';
    card.className = 'agent-popup-card';
    card.setAttribute('dir', 'rtl');
    card.style.display = 'none';
    if (stageEl && stageEl.appendChild) {
      stageEl.appendChild(card);
    }
  }
  return card;
}

function renderAgentCard(bot) {
  const card = getOrCreateCard();
  if (!card || !bot || typeof document === 'undefined' || typeof document.createElement !== 'function') return;

  while (card.firstChild) {
    card.removeChild(card.firstChild);
  }

  // Header: Name + Close Button
  const header = document.createElement('div');
  header.className = 'agent-card-header';
  header.style.cssText = 'display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; border-bottom:1px solid rgba(148,163,184,0.2); padding-bottom:6px;';

  const nameEl = document.createElement('div');
  nameEl.className = 'agent-card-name';
  nameEl.style.cssText = 'font-weight:bold; font-size:14px; color:#f8fafc;';
  nameEl.textContent = bot.name;
  header.appendChild(nameEl);

  const closeBtn = document.createElement('button');
  closeBtn.className = 'agent-card-close';
  closeBtn.type = 'button';
  closeBtn.setAttribute('aria-label', 'إغلاق');
  closeBtn.style.cssText = 'background:none; border:none; color:#94a3b8; font-size:16px; cursor:pointer; padding:2px 6px; line-height:1; border-radius:4px;';
  closeBtn.textContent = '✕';
  closeBtn.onclick = function(e) {
    if (e && e.stopPropagation) e.stopPropagation();
    closeAgentCard();
  };
  header.appendChild(closeBtn);
  card.appendChild(header);

  // Status label
  const statusRow = document.createElement('div');
  statusRow.className = 'agent-card-status';
  statusRow.style.cssText = 'font-size:12px; margin-bottom:8px; font-weight:600;';
  if (bot.status === 'stuck') {
    statusRow.style.color = '#ef4444';
    statusRow.textContent = '🔴 متأخر ' + bot.progress + '% ⚠️';
  } else if (bot.status === 'working') {
    statusRow.style.color = '#10b981';
    statusRow.textContent = '🟢 شغال ' + bot.progress + '%';
  } else {
    statusRow.style.color = '#94a3b8';
    statusRow.textContent = '☕ متاح';
  }
  card.appendChild(statusRow);

  // If working or stuck, show task, step, %, next, updated
  if (bot.status !== 'idle') {
    const details = document.createElement('div');
    details.className = 'agent-card-details';
    details.style.cssText = 'font-size:11.5px; display:flex; flex-direction:column; gap:4px; margin-bottom:10px; color:#cbd5e1;';

    const taskTitle = cleanBoardTaskTitle(bot);
    if (taskTitle) {
      const taskRow = document.createElement('div');
      taskRow.className = 'agent-card-task';
      taskRow.textContent = 'المهمة: ' + taskTitle;
      details.appendChild(taskRow);
    }

    if (bot.step) {
      const stepRow = document.createElement('div');
      stepRow.className = 'agent-card-step';
      stepRow.textContent = 'الخطوة: ' + bot.step;
      details.appendChild(stepRow);
    }

    const pctRow = document.createElement('div');
    pctRow.className = 'agent-card-percent';
    pctRow.textContent = 'الإنجاز: ' + bot.progress + '%';
    details.appendChild(pctRow);

    if (bot.next) {
      const nextRow = document.createElement('div');
      nextRow.className = 'agent-card-next';
      nextRow.textContent = 'التالي: ' + bot.next;
      details.appendChild(nextRow);
    }

    const updateRow = document.createElement('div');
    updateRow.className = 'agent-card-updated';
    updateRow.style.cssText = 'color:#64748b; font-size:10.5px; margin-top:2px;';
    const minsAgo = bot.updatedAt ? formatMinutesAgo(Date.parse(bot.updatedAt)) : 0;
    updateRow.textContent = 'آخر تحديث منذ ' + minsAgo + ' د';
    details.appendChild(updateRow);

    card.appendChild(details);
  }

  // Cheer button
  const cheerBtn = document.createElement('button');
  cheerBtn.className = 'agent-card-cheer';
  cheerBtn.type = 'button';
  cheerBtn.style.cssText = 'width:100%; background:#f59e0b; color:#0f172a; border:none; border-radius:6px; padding:6px 10px; font-weight:bold; font-size:12px; cursor:pointer; font-family:inherit; transition:background 0.15s;';
  cheerBtn.textContent = ['\u0634\u062c\u0651\u0639\u0647', '\u{1F44F}'].join(' ');
  cheerBtn.onclick = function(e) {
    if (e && e.stopPropagation) e.stopPropagation();
    celebrateBot(bot, '👏 برافو!');
  };
  card.appendChild(cheerBtn);
}

function openAgentCard(botId, clickX, clickY) {
  const bot = BOTS[botId];
  if (!bot) return;
  selectedCardBotId = botId;
  const card = getOrCreateCard();
  if (!card) return;

  renderAgentCard(bot);
  card.style.display = 'block';

  if (stageEl) {
    const stageRect = stageEl.getBoundingClientRect ? stageEl.getBoundingClientRect() : { left: 0, top: 0, width: 800, height: 540 };
    const botPos = getBotScreenPos(bot);
    let left = botPos.x - stageRect.left + 16;
    let top = botPos.y - stageRect.top - 20;

    const cardW = 230;
    const cardH = 180;
    const maxLeft = (stageEl.clientWidth || (typeof window !== 'undefined' ? window.innerWidth : 800)) - cardW - 10;
    const maxTop = (stageEl.clientHeight || (typeof window !== 'undefined' ? window.innerHeight : 540)) - cardH - 10;

    if (left > maxLeft) left = Math.max(10, botPos.x - stageRect.left - cardW - 16);
    if (left < 10) left = 10;
    if (top > maxTop) top = Math.max(10, maxTop);
    if (top < 10) top = 10;

    card.style.left = left + 'px';
    card.style.top = top + 'px';
  }
}

function closeAgentCard() {
  selectedCardBotId = null;
  const card = document.getElementById('agent-card-popup');
  if (card) {
    card.style.display = 'none';
  }
}

if (stageEl) {
  stageEl.addEventListener('mousemove', (e) => {
    if (!canvas) return;
    const rect = canvas.getBoundingClientRect();
    if (STACKED_ON) { par.tx = 0; par.ty = 0; hoveredBotId = null; return; }
    if (REDUCED_MOTION || cam.tzoom > 1.05) { par.tx = 0; par.ty = 0; }
    else {
      par.tx = (0.5 - (e.clientX - rect.left) / rect.width) * 15;
      par.ty = (0.5 - (e.clientY - rect.top) / rect.height) * 9;
    }
    const found = findBotAtPointer(e.clientX, e.clientY);
    hoveredBotId = found ? found.id : null;
  });

  stageEl.addEventListener('mouseleave', () => { par.tx = 0; par.ty = 0; hoveredBotId = null; });

  stageEl.addEventListener('click', (e) => {
    const card = document.getElementById('agent-card-popup');
    if (card && card.contains && e.target && card.contains(e.target)) return;

    const found = findBotAtPointer(e.clientX, e.clientY);
    if (found) {
      openAgentCard(found.id, e.clientX, e.clientY);
    } else {
      closeAgentCard();
    }
  });
}

if (typeof window !== 'undefined' && typeof window.addEventListener === 'function') {
  window.addEventListener('keydown', (e) => {
    if (e && e.key === 'Escape') closeAgentCard();
  });
} else if (typeof document !== 'undefined' && typeof document.addEventListener === 'function') {
  document.addEventListener('keydown', (e) => {
    if (e && e.key === 'Escape') closeAgentCard();
  });
}

if (typeof window !== 'undefined') {
  window.cleanBoardTaskTitle = cleanBoardTaskTitle;
  window.fitBoardTitle = fitBoardTitle;
  window.openAgentCard = openAgentCard;
  window.closeAgentCard = closeAgentCard;
  window.renderAgentCard = renderAgentCard;
  window.findBotAtPointer = findBotAtPointer;
}

// ---------- Live Feed ----------
let lastGoodFetchMs = null;
let lastFeedPayload = null;
let feedReachable = false;
let feedInitialized = false;

function formatMinutesAgo(ms) {
  return Math.max(0, Math.floor((Date.now() - ms) / 60000));
}

// Today's numbers for the wall board — derived only from the feed payload:
// achievements counted from bots whose own update landed today, one timeline
// event per such bot at its real updated_at, and the merged-PR count for
// today. The current feed exposes only open_prs (verified live: no
// merged_prs / closed_prs / merged field exists in the payload), so merged
// stays "no data" until the feed actually carries a merged list — the open
// count is never relabelled as merged. If a merged list appears, entries
// with a merge/close date are counted only when that date is today;
// entries without any date are counted as-is (the list itself is the
// feed's merged set).
function computeTodayStats(payload) {
  const now = new Date();
  const dayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
  let done = 0;
  const events = [];
  if (payload && payload.bots) {
    for (const k of BOT_KEYS) {
      const e = payload.bots[k];
      if (!e) continue;
      const t = e.updated_at ? Date.parse(e.updated_at) : NaN;
      if (!Number.isFinite(t) || t < dayStart) continue;
      events.push({ t: t, status: computeEffectiveStatus(e, Date.now()) });
      if (Array.isArray(e.recent)) done += e.recent.length;
    }
  }
  events.sort((a, b) => a.t - b.t);

  // Merged PRs today — only from a real merged list in the feed, if any.
  let mergedList = null;
  if (payload) {
    const candidates = [payload.merged_prs, payload.mergedprs, payload.closed_prs, payload.prs_merged, payload.merged];
    for (const c of candidates) {
      if (Array.isArray(c)) { mergedList = c; break; }
    }
    if (!mergedList && Array.isArray(payload.prs)) {
      const mergedFromPrs = payload.prs.filter((pr) => pr && (pr.merged === true || String(pr.state || '').toLowerCase() === 'merged'));
      if (mergedFromPrs.length > 0 || payload.prs.some((pr) => pr && ('merged' in pr || 'merged_at' in pr))) mergedList = mergedFromPrs;
    }
    if (!mergedList && Array.isArray(payload.open_prs)) {
      // An open_prs entry explicitly flagged merged still counts as merge
      // data; a plain open list does not.
      const flagged = payload.open_prs.filter((pr) => pr && (pr.merged === true || pr.merged_at));
      if (flagged.length > 0) mergedList = flagged;
    }
  }
  let mergedPrs = null;
  if (mergedList) {
    mergedPrs = 0;
    for (const pr of mergedList) {
      if (!pr || typeof pr !== 'object') { mergedPrs++; continue; }
      const dateStr = pr.merged_at || pr.mergedAt || pr.closed_at || pr.closedAt || pr.updated_at || pr.date || null;
      if (!dateStr) { mergedPrs++; continue; }
      const t = Date.parse(dateStr);
      if (!Number.isFinite(t) || t >= dayStart) mergedPrs++;
    }
  }

  todayStats = {
    loaded: true,
    done: done,
    openPrs: payload && Array.isArray(payload.open_prs) ? payload.open_prs.length : 0,
    mergedPrs: mergedPrs,
    hasMergedData: mergedList !== null,
    events: events
  };
}

function computeEffectiveStatus(entry, nowMs) {
  const updatedMs = entry && entry.updated_at ? Date.parse(entry.updated_at) : NaN;
  const openOrder = Boolean(entry && entry.open_order);
  const rawState = String((entry && entry.state) || 'idle').toLowerCase();
  const isStale = openOrder && (!Number.isFinite(updatedMs) || (nowMs - updatedMs) > STALE_AFTER_MS);
  if (rawState === 'stuck' || isStale) return 'stuck';
  if (rawState === 'working') return 'working';
  return 'idle';
}

function applyLiveFeed(payload) {
  if (!payload || typeof payload !== 'object' || !payload.bots) return;
  const nowMs = Date.now();
  for (const key of BOT_KEYS) {
    const bot = BOTS[key];
    const incoming = payload.bots[key];
    if (!incoming) continue;
    const prevProgress = bot.progress;
    const prevRecent = bot.recent || [];
    const status = computeEffectiveStatus(incoming, nowMs);
    const pct = Math.max(0, Math.min(100, Math.round(Number(incoming.percent) || 0)));
    const taskId = incoming.task_id ? String(incoming.task_id) : '';
    const taskTitle = incoming.task_title ? String(incoming.task_title) : '';
    const step = incoming.step ? String(incoming.step) : '';
    const next = incoming.next ? String(incoming.next) : '';

    bot.status = status;
    bot.progress = status === 'idle' ? 0 : pct;
    bot.taskId = taskId;
    bot.taskTitle = taskTitle;
    bot.task_title = taskTitle;
    bot.step = step;
    bot.next = next;
    bot.updatedAt = incoming.updated_at || null;
    bot.openOrder = Boolean(incoming.open_order);
    bot.recent = Array.isArray(incoming.recent) ? incoming.recent.slice(0, 3).map(String) : [];

    // A finished task earns a little celebration bubble above the bot
    if (feedInitialized) {
      const newFirst = bot.recent[0];
      if (newFirst && prevRecent.indexOf(newFirst) === -1) {
        celebrateBot(bot, '🎉 خلصت: ' + newFirst);
      } else if (status === 'working' && prevProgress < 100 && bot.progress >= 100) {
        celebrateBot(bot, '🎉 المهمة اكتملت 100%');
      }
    }

    if (status === 'stuck') {
      const labelTitle = taskTitle || taskId || 'مهمة مفتوحة';
      bot.shortTask = labelTitle.slice(0, 20) + ' 🔴 متأخر';
      bot.statusLabel = '🔴 متأخر (' + bot.progress + '%)';
      bot.task = taskTitle || taskId || 'مهمة مفتوحة بدون تحديث لأكثر من ٤٥ دقيقة';
      bot.location = 'تحديث متأخر > ٤٥ دقيقة';
    } else if (status === 'working') {
      const labelTitle = taskTitle || taskId || 'شغل جاري';
      bot.shortTask = labelTitle.slice(0, 22) + ' ' + bot.progress + '%';
      bot.statusLabel = '🟢 شغال ' + bot.progress + '%';
      bot.task = taskTitle || taskId || 'مهمة قيد التنفيذ';
      bot.location = bot.updatedAt ? 'آخر تحديث ' + formatMinutesAgo(Date.parse(bot.updatedAt)) + ' د' : 'في المكتب';
    } else {
      bot.shortTask = '☕ متاح';
      bot.statusLabel = '☕ استراحة / متاح';
      bot.task = 'لا توجد مهمة مفتوحة حالياً';
      bot.location = bot.updatedAt ? 'آخر نشاط منذ ' + formatMinutesAgo(Date.parse(bot.updatedAt)) + ' د' : 'متاح';
    }

    if (bot.baseWander) {
      bot.wander = (status === 'idle');
      if (!bot.wander) {
        bot.x = bot.homeX;
        bot.y = bot.homeY;
      }
    }
  }
  computeTodayStats(payload);
  if (selectedCardBotId && BOTS[selectedCardBotId]) {
    renderAgentCard(BOTS[selectedCardBotId]);
  }
  feedInitialized = true;
}

async function fetchLiveFeed() {
  try {
    const res = await fetch(FEED_URL + '?t=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    if (!data || typeof data !== 'object' || !data.bots) throw new Error('Invalid feed');
    lastFeedPayload = data;
    lastGoodFetchMs = Date.now();
    feedReachable = true;
    applyLiveFeed(data);
  } catch (e) {
    feedReachable = false;
    if (lastFeedPayload) {
      // Keep last known data and re-evaluate 45-min stale marks without inventing anything
      applyLiveFeed(lastFeedPayload);
    }
  }
}

// ---------- Celebration bubbles ----------
// A finished task earns a little celebration bubble above the bot,
// drawn inside the scene itself.
function celebrateBot(bot, text) {
  bot.bubbleText = String(text).slice(0, 42);
  bot.bubbleUntil = performance.now() + 5200;
}

// ---------- Startup ----------
// The live feed drives every bot's state, task bubble and the wall
// boards: first fetch immediately, then a poll every 30 seconds.
fetchLiveFeed();
setInterval(fetchLiveFeed, POLL_INTERVAL_MS);

requestAnimationFrame(gameLoop);
</script>
